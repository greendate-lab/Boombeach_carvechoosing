<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海岛奇兵雕刻选择</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#121821; --card:#1b2430; --card2:#222d3c; --line:#2c3848;
  --tx:#e8edf3; --mut:#8b98a9; --mut2:#61707f;
  --gold:#e3a84b; --gold-d:#b9822f;
  --g:#43d17a; --b:#4cc3f5; --r:#ff7043; --p:#9e2f85;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:#0b0f15;color:var(--tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.5)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));flex:none;
  background:rgba(18,24,33,.92);border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.topbar .sub{font-size:11px;color:var(--mut)}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}
.content{flex:1;overflow-y:auto;padding:14px 16px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:10px;letter-spacing:.3px}
.dots{display:flex;gap:6px;align-items:center}
.cdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.c-g{background:var(--g)}.c-b{background:var(--b)}.c-r{background:var(--r)}.c-p{background:var(--p)}
.duo{display:flex;gap:10px}
.duo .card{flex:1;margin-bottom:12px}
.seq{display:flex;gap:5px;margin-top:4px;min-height:30px;align-items:center;flex-wrap:nowrap}
.tile{width:calc((100% - 15px)/4);max-width:32px;aspect-ratio:1/1;height:auto;border-radius:22%;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0c1117}
.t-g{background:var(--g)}.t-b{background:var(--b)}.t-r{background:var(--r)}.t-p{background:var(--p)}
.efx{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.5}
.efx b{color:var(--tx);font-weight:600}
.gtime{font-size:10.5px;color:var(--mut2);margin-top:5px}
.gempty{color:var(--mut2);font-size:12px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
  border-radius:13px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.13s;width:100%;text-align:left;color:var(--tx)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--gold);background:linear-gradient(180deg,#26303f,#1d2735)}
.opt .tiles{display:flex;gap:5px;flex-wrap:wrap}
.opt .mini{width:26px;height:26px;border-radius:7px;font-size:12px;color:#0c1117;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.opt .meta{flex:1;min-width:0}
.opt .meta .t{font-size:13px;font-weight:600}
.opt .cost{display:flex;gap:7px;margin-top:5px;flex-wrap:nowrap;overflow:hidden}
.opt .cost span{font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:3px;flex:none}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.sel .radio{border:5px solid var(--gold)}
.confirm{width:100%;border:none;padding:15px 16px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--gold);color:#1a1305;display:none;align-items:center;justify-content:center;gap:8px;
  flex:none;box-shadow:0 -8px 18px rgba(0,0,0,.55)}
.confirm.show{display:flex}
.opbar{flex:none;display:flex;background:rgba(20,27,37,.98);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.opbtn{flex:1;border:none;background:none;color:var(--mut2);display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:4px 0;font-size:9.5px;cursor:pointer}
.opbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.opbtn.on{color:var(--gold)}
.tabbar{flex:none;display:flex;background:rgba(20,27,37,.98);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:none;background:none;color:var(--mut2);padding:7px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--gold)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);padding:8px 4px;border-radius:8px;
  font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1305;font-weight:700}
.pane{display:none}.pane.on{display:block}
.choice{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1.5px solid transparent;
  border-radius:11px;padding:11px 12px;margin-bottom:8px;color:var(--tx);cursor:pointer;text-align:left;font-size:13.5px}
.choice.on{border-color:var(--gold)}
.choice .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none}
.choice.on .rd{border:5px solid var(--gold)}
.choice small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.cinput{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.cinput label{font-size:13px;display:flex;align-items:center;gap:8px;flex:1}
.cinput input{width:90px;background:#10161e;border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-size:16px;padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums}
.hday{font-size:11px;color:var(--mut2);margin:14px 2px 7px}
.hitem{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;margin-bottom:8px}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hrange{font-size:12.5px;font-weight:700;color:var(--gold)}
.hpick{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx)}
.htime{font-size:10.5px;color:var(--mut);margin-top:6px}
.hitem .n{font-size:11px;color:var(--mut2);width:34px}
.hitem .nm{flex:1;font-size:13px}
.hitem .nm small{display:block;color:var(--mut);font-size:10.5px;margin-top:3px;font-weight:400}
.hitem .tm{font-size:11px;color:var(--mut)}
.about-hero{text-align:center;padding:18px 0 6px}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;
  background:linear-gradient(145deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center}
.logo svg{width:34px;height:34px;stroke:#1a1305;fill:none;stroke-width:1.8}
.ver{font-size:12px;color:var(--mut)}
.accrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.accrow.on{border-color:var(--gold);background:var(--card2)}
.accrow .av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;color:var(--gold);flex:none}
.accrow.on .av{background:var(--gold);color:#1a1305}
.accrow .accinfo{flex:1;display:flex;flex-direction:column;min-width:0;text-align:left}
.accrow .accinfo b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .accinfo small{font-size:11px;color:var(--mut)}
.accrow .ren{flex:none;border:none;background:var(--card2);color:var(--mut2);border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.accrow .rd{width:16px;height:16px;border:2px solid var(--mut2);border-radius:50%;flex:none}
.accrow.on .rd{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--card2)}
.acc .av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:var(--gold);flex:none}
.wl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:2px}
.wl b{color:var(--gold)}
.wl .q{flex:none;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;background:var(--card2);
  color:var(--mut);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lnsel{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.infobody{padding:4px 2px;font-size:13px;line-height:1.75;color:var(--tx);white-space:pre-line}
.accrow .del{flex:none;border:none;background:var(--card2);color:#e0645c;border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wl .wv{width:76px;background:#10161e;border:1px solid var(--line);border-radius:8px;color:var(--gold);
  font-size:14px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
/* 雕刻权重双滑块 */
.efxw{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
.efxw:last-child{border-bottom:none}
.efxw-n{width:76px;font-size:12.5px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dual{position:relative;height:30px;flex:1;min-width:0}
.dual .track{position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line);border-radius:2px}
.dual input{position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;background:transparent;
  pointer-events:none;margin:0;height:30px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  cursor:pointer;pointer-events:auto;border:2px solid #0c1117}
.dual input.es::-webkit-slider-thumb{background:var(--gold)}
.dual input.eb::-webkit-slider-thumb{background:var(--b)}
.dual input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;cursor:pointer;pointer-events:auto;border:2px solid #0c1117}
.dual input.es::-moz-range-thumb{background:var(--gold)}
.dual input.eb::-moz-range-thumb{background:var(--b)}
.efxw-v{width:66px;font-size:10px;color:var(--mut);flex:none;text-align:right;font-variant-numeric:tabular-nums}
/* 序列菜单/查看 */
.modal{position:fixed;inset:0;background:rgba(5,8,12,.74);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.mcard{width:86%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mcard h3{margin-bottom:12px;font-size:15px}
.mopt{display:block;width:100%;padding:12px;margin-bottom:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:14px;text-align:left}
.mopt:active{background:var(--line)}
.mopt.ghost{background:none;color:var(--mut)}
.mcard.wide{max-width:390px;height:76vh;display:flex;flex-direction:column}
.mtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mtitle h3{font-size:14px;margin:0}
.x{background:none;border:none;color:var(--mut);font-size:22px;padding:2px 8px}
.seqbody{flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#0d1218}
.seqt{width:100%;border-collapse:collapse;font-size:12px}
.seqt th,.seqt td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.seqt th{position:sticky;top:0;background:var(--card2);color:var(--mut2)}
.seqt th.cg{color:var(--g)}.seqt th.cb{color:var(--b)}.seqt th.cr{color:var(--r)}.seqt th.cp{color:var(--p)}
input[type=range]{width:100%;height:30px;accent-color:var(--gold)}
.pchart{display:flex;align-items:flex-end;justify-content:space-around;height:150px;
  border-bottom:2px solid var(--line);padding:0 4px;margin-bottom:6px}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1}
.pbar{width:34px;background:linear-gradient(#7fb0e8,#5b93d6);border-radius:5px 5px 0 0;min-height:2px;transition:height .12s}
.pnum{font-size:12px;font-weight:700;margin-bottom:3px}
.plab{font-size:10.5px;color:var(--mut);margin-top:5px}
.pinfo{font-size:12px;line-height:1.7;color:var(--tx)}
.pinfo b{color:#e05a4f;font-weight:700}
.miss{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.miss span{font-size:11px;padding:4px 9px;border-radius:14px;background:var(--card2);color:var(--mut)}
.miss b{color:var(--gold)}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
  background:#0d131b;border:1.2px solid var(--gold);color:#fff;font-weight:700;font-size:13.5px;
  padding:10px 16px;max-width:86%;text-align:center;white-space:normal;
  border-radius:24px;opacity:0;pointer-events:none;transition:.22s;z-index:20;
  box-shadow:0 3px 12px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ==== 与 App 1.1.0 对齐的补充样式 ==== */
.appl{margin-left:auto;background:var(--gold);color:#1a1305;border:none;border-radius:8px;
  padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.seqt{font-size:11px}
.seqt th,.seqt td{padding:5px 3px}
.cellw{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.cellw .enm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cellw .egr{font-weight:700;flex:none}
.logv{font-size:12.5px;font-weight:700;color:var(--gold)}
.logd{font-size:11px;color:var(--mut2);margin-left:8px}
.logi{display:flex;gap:7px;font-size:12px;color:var(--mut);line-height:1.55;margin-top:4px}
.logi i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:6px}
/* 水晶图（内嵌 base64，与 App 同一批图） */
.cimg{display:inline-block;width:9px;height:14px;background-repeat:no-repeat;background-size:contain;background-position:center bottom;flex:none}

.whead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.whead h3{margin-bottom:0;flex:1}

</head>
<body>
<div class="app" id="app">

  <!-- ============ 主页 HOME ============ -->
  <section class="screen active" data-screen="home">
    <div class="topbar"><h1>海岛奇兵雕刻选择</h1><span class="sub" id="roundSub"></span></div>
    <div class="content">
      <div class="duo">
        <div class="card">
          <h3 data-i18n="gain"></h3>
          <div id="gainContent"><span class="gempty" data-i18n="gainEmpty"></span></div>
        </div>
        <div class="card">
          <h3 data-i18n="lines"></h3>
          <input type="number" id="startLine" min="1" value="12"
            style="width:100%;background:#10161e;border:1px solid var(--line);border-radius:9px;color:var(--tx);font-size:16px;padding:10px">
          <div class="efx" id="startHint"></div>
        </div>
      </div>

      <h3 style="font-size:12px;color:var(--mut);font-weight:600;margin:4px 2px 10px" data-i18n="options"></h3>
      <div id="optList"></div>
    </div>
    <button class="confirm" id="confirmBtn">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      <span data-i18n="confirm"></span></button>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="screen" data-screen="history">
    <div class="topbar"><button class="back" data-back>‹</button><h1 data-i18n="history"></h1></div>
    <div class="content"><div id="histList"></div></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="screen" data-screen="settings">
    <div class="topbar"><button class="back" data-back>‹</button><h1 data-i18n="settings"></h1><button class="appl" id="efxApply" data-i18n="apply" style="display:none"></button></div>
    <div class="content">
      <div class="seg" id="setSeg">
        <button class="on" data-pane="preference" data-i18n="preference"></button>
        <button data-pane="language" data-i18n="language"></button>
        <button data-pane="about" data-i18n="about"></button>
        <button data-pane="account" data-i18n="account"></button>
      </div>

      <div class="pane on" data-pane="preference">
        <div class="card">
          <div class="whead"><h3 data-i18n="weights"></h3><button class="chip" id="wPreset"></button></div>
          <div style="margin-bottom:10px">
            <div class="wl"><span data-i18n="wCrystal"></span><button class="q" data-q="cry">?</button><input class="wv" id="wv0" data-i="0" type="number" min="-1" max="1" step="0.01" value="0"></div>
            <input type="range" class="ws" min="-1" max="1" step="0.01" value="0"></div>
          <div style="margin-bottom:10px">
            <div class="wl"><span data-i18n="wTime"></span><button class="q" data-q="time">?</button><input class="wv" id="wv1" data-i="1" type="number" min="-1" max="1" step="0.01" value="0"></div>

 "炼金技术","战地急救","炮火连天","绝缘材料","干扰信号","能量涌动","肾上腺素"]);
const DEFENCE={"投诚":{S:11,B:8},"过热":{S:10,B:5},"昏沉":{S:9,B:4},"力竭":{S:9,B:4},
 "接地":{S:8,B:3},"辅助":{S:8,B:3},"过载":{S:10,B:5},"硬化":{S:9,B:5},
 "修补":{S:10,B:5},"干扰":{S:7,B:4},"加固":{S:8,B:4},"保险":{S:9,B:5}};
const DEFENCE_NAMES=["过载","力竭","硬化","昏沉","修补","干扰","投诚","接地","加固","保险","过热","辅助"];

let CRYSTAL_SLIDER=0, B=0, C=0, PREFERENCE="attack";
const PREF_BOOST=1.2, PREF_PENALTY=0.8;
const LINE_COST=[5,7,15,30];
const DEFAULT_CRYSTALS={"绿色":1000,"蓝色":1000,"红色":1000,"紫色":1000};
const HOURS_PER_RUN=8, DAILY_GAIN=2, TOPUP=500;
const GOOD_T=0.95;   // 选1行所需的当前轮最高质量分（偏好后0~1），可调

const PRESET_VERSION=2;   // 预设版本号：老存档一次性升级（与 App 一致）
// 雕刻权重默认值：按 2026-10-10 表格「假如选择自定义（合并计算）」那一组
const EFX_TABLE={"坚固装甲":[1,0.92],"昏沉":[0.98,0.91],"前仆后继":[0.9,0.84],"过热":[0.9,0.84],
  "破坏阻滞":[0.85,0.79],"投诚":[0.85,0.79],"情报压制":[0.75,0.45],"修补":[0.75,0.45],
  "活力汲取":[0.7,0.5],"力竭":[0.7,0.5],"战地急救":[0.45,0.25],"保险":[0.45,0.25],
  "能量涌动":[0.35,0.21]};
const EFX_OTHER=[0.2,0.1];
const EFX_W={};
[...ATTACK,...Object.keys(DEFENCE)].forEach(n=>{
  const v=EFX_TABLE[n]||EFX_OTHER;
  EFX_W[n]={S:v[0],B:v[1]};
});
// 旧版默认权重（分数/14、防御/14、其余 0.5）：只用来判断这个值还是不是旧默认值
function legacyEfxW(){
  const m={};
  [...ATTACK,...Object.keys(DEFENCE)].forEach(n=>{
    const s=SCORES[n+"|S"], b=SCORES[n+"|B"], ds=DEFENCE[n];
    m[n]={S:s!==undefined?s/14:(ds?ds.S/14:0.5), B:b!==undefined?b/14:(ds?ds.B/14:0.5)};
  });
  return m;
}
// 老存档一次性升级：权重仍是旧默认值时换成新预设，用户自己调过的不动
function migratePreset(d){
  const pv=(d&&d.presetVersion)?+d.presetVersion:1;
  if(pv>=PRESET_VERSION) return;
  const w=document.querySelectorAll(".ws");
  if(w.length>=3){
    if(Math.abs(+w[1].value+0.85)<1e-9) w[1].value=0;
    if(Math.abs(+w[2].value-1)<1e-9) w[2].value=0;
  }
  const legacy=legacyEfxW();
  Object.keys(EFX_W).forEach(n=>{
    const cur=EFX_W[n], old=legacy[n];
    if(!cur||!old) return;
    let s=+cur.S, b=+cur.B;
    if(s>1) s/=14;
    if(b>1) b/=14;
    if(Math.abs(s-old.S)<1e-6&&Math.abs(b-old.B)<1e-6){
      const v=EFX_TABLE[n]||EFX_OTHER; cur.S=v[0]; cur.B=v[1];
    }
  });
}
function qualityRaw(e,g){const w=EFX_W[e];return w&&w[g]!==undefined?w[g]:0.5;}
function qualityNorm(e,g){return qualityRaw(e,g);}
function applyPreference(q,e){
  if(PREFERENCE==="custom") return q;
  const ia=ATTACK.has(e), id=DEFENCE[e]!==undefined;
  if(PREFERENCE==="attack"&&ia) return q*PREF_BOOST;
  if(PREFERENCE==="defence"&&id) return q*PREF_BOOST;
  if((PREFERENCE==="attack"||PREFERENCE==="defence")&&(ia||id)) return q*PREF_PENALTY;
  return q;
}
function totalCost(n){let s=0;for(let i=0;i<n;i++)s+=LINE_COST[i];return s;}
function balanceFactor(st){
  const vs=COLORS.map(c=>st[c]); const m=vs.reduce((a,b)=>a+b,0)/vs.length;
  if(m<=0) return 1;
  const sd=Math.sqrt(vs.reduce((a,v)=>a+(v-m)**2,0)/vs.length);
  return Math.max(0,Math.min(1,1-sd/m));
}
function crystalDim(n,picks,cry,sl){
  if(sl===0||!cry) return 0;
  const uniq=[...new Set(picks.map(p=>p[1]))];
  const ranked=[...uniq].sort((a,b)=>cry[a]-cry[b]);
  const co={}; ranked.forEach((c,i)=>co[c]=LINE_COST[i]);
  const st={...cry}; picks.forEach(p=>{st[p[1]]-=co[p[1]];});
  const save=1-Object.values(co).reduce((a,b)=>a+b,0)/totalCost(4);
  const bal=-(1-balanceFactor(st));
  return sl>0? sl*save : (-sl)*bal;
}
function goodThreshold(Bv){
  if(Bv<=0.8) return GOOD_T;                 // 0.8及以下：门槛很严，基本最低2
  return GOOD_T*(1-(Bv-0.8)/0.2);           // 0.8 -> GOOD_T，1 -> 0（全放行）
}
function roundBest(data,r){
  const pr=COLORS.filter(c=>data[r][c]&&data[r][c].length>=2)
    .map(c=>applyPreference(qualityNorm(data[r][c][0],data[r][c][1]),data[r][c][0]));
  return pr.length?Math.max(...pr):0;
}
function nTarget(Bv){
  // 滑块决定的「目标条数」：-1 -> 4，0.8 -> 2，1 -> 1
  if(Bv<=0.8) return 4-(Bv+1)/1.8*2;  // -1:4，0.8:2
  return 2-(Bv-0.8)/0.2;              // 0.8:2，1:1
}
function timeScore(n,Bv){
  // 离目标条数越近分越高（峰=1，每差1条约 -0.67）
  return Math.max(-1, 1-Math.abs(n-nTarget(Bv))*0.67);
}
function comboTotal(picks,n,Q2,cry,ignoreTime){
  let Q1=0; picks.forEach(p=>Q1+=applyPreference(qualityNorm(p[2],p[3]),p[2]));
  const qs=Q2>0?2*(Q1/Q2)-1:-1;
  const ts=ignoreTime?0:timeScore(n,B);
  return crystalDim(n,picks,cry,CRYSTAL_SLIDER)+ts+qs*C;  // 时间分直接生效，B只定目标条数
}
function perms(arr,n){
  const r=[];
  (function rec(rem,cur){
    if(cur.length===n){r.push(cur);return;}
    for(let i=0;i<rem.length;i++)
      rec(rem.slice(0,i).concat(rem.slice(i+1)),cur.concat(rem[i]));
  })(arr,[]); return r;
}
function q2of(data,rounds){
  let Q2=0;
  rounds.forEach(rr=>{
    const pr=COLORS.filter(c=>data[rr][c]&&data[rr][c].length>=2)
      .map(c=>applyPreference(qualityNorm(data[rr][c][0],data[rr][c][1]),data[rr][c][0]));
    if(pr.length) Q2+=Math.max(...pr);
  }); return Q2;
}
function bestForN(data,start,n,cry){
  const rounds=[]; for(let r=start;r<start+n;r++) if(data[r]) rounds.push(r);
  if(rounds.length<n) return null;
  const Q2=q2of(data,rounds);
  let best=null;
  for(const picked of perms(COLORS,n)){
    const picks=[]; let ok=true;
    rounds.forEach((rr,i)=>{
      const cell=data[rr][picked[i]];
      if(!cell||cell.length<2) ok=false; else picks.push([rr,picked[i],cell[0],cell[1]]);
    });
    if(!ok) continue;
    const t=comboTotal(picks,n,Q2,cry);
    if(!best||t>best[0]) best=[t,picks];
  } return best;
}
function decideLines(data,start,cry){
  const keys=Object.keys(data).map(Number);
  const maxN=Math.min(4,Math.max(...keys)-start+1);
  let best=null;
  for(let n=1;n<=maxN;n++){
    const rounds=[]; for(let r=start;r<start+n;r++) if(data[r]) rounds.push(r);
    if(rounds.length<n) continue;
    if(n===1 && roundBest(data,start)<goodThreshold(B)) continue;  // 没好雕刻不选1
    const Q2=q2of(data,rounds);
    const res=bestForN(data,start,n,cry);
    if(!res) continue;
    const [total,picks]=res;
    let Q1=0; picks.forEach(p=>Q1+=applyPreference(qualityNorm(p[2],p[3]),p[2]));
    const cand={n,per:total/n,
      quality:Q2>0?2*(Q1/Q2)-1:-1,
      time:timeScore(n,B),
      crystal:crystalDim(n,picks,cry,CRYSTAL_SLIDER),picks};
    if(!best||cand.per>best.per) best=cand;
  } return best;
}

function enDate(s){const m=String(s).match(/(\d+)月(\d+)日/);if(!m)return s;
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[1]-1];

function renderHistory(){
  const box=document.getElementById("histList"); let html="";
  const L=I18N[lang];
  const hist=ACCTS[curAcc].hist||[];
  // 拍平（新的在前）：某条的领取时间 = 比它新的那条的建造时间
  const flat=[];
  hist.forEach(g=>g.slice(1).forEach(it=>flat.push(it)));
  hist.forEach(group=>{
    const g0=group[0][0], g1=group[0][1];
    const dn=lang==="en"?(DAY_EN[g0]||g0):g0;
    const ds=lang==="en"?enDate(g1):g1;
    html+='<div class="hday">'+dn+"  "+ds+"</div>";
    group.slice(1).forEach(it=>{
      const idx=flat.indexOf(it);
      const claim=(idx>0)?flat[idx-1][1]:null;
      const picks=it[2]||[];
      const k=picks.length;
      const range=(k<=1)?("#"+(k===0?it[0]:(it[0]-1))):("#"+(it[0]-k)+" - "+(it[0]-1));
      const items=picks.map(c=>'<span class="hpick"><i class="cimg cimg-'+LETTERS[c[0]].toLowerCase()+'"></i>'+efxName(c[1])+" "+c[2]+'</span>').join("");
      const times=(claim==null)?("（"+L.buildTime+"："+it[1]+"　"+L.notClaimed+"）")
                              :("（"+L.buildTime+"："+it[1]+"　"+L.claimTime+"："+claim+"）");
      html+='<div class="hitem"><div class="hrow"><span class="hrange">'+range+'</span>'+items+'</div>'+
        '<div class="htime">'+times+'</div></div>';
    });
  });
  box.innerHTML=html;
}function renderRound(){

// ---- 序列导入（CSV / XLSX）：表头识别列，自动跳过空行/空列/空单元格，行数任意 ----
function csvRows(text){
  const t=String(text||"").replace(/^\uFEFF/,"");
  const delim=(t.includes("\t")&&!t.includes(","))?"\t":",";
  return t.split(/\r?\n/).map(l=>l.split(delim).map(x=>String(x==null?"":x).trim()));
}
// 全部雕刻名（长的先匹配，避免干扰抢走干扰信号）
function effectNames(){
  return [...ATTACK,...Object.keys(DEFENCE)].sort((a,b)=>b.length-a.length);
}
// 等级判定：S/s//品质提升/提升 -> S ； B/b/币/没写等级 -> B
function gradeOf(before,after){
  const head=s=>{const t=String(s==null?"":s).replace(/\s/g,"");return t.length>4?t.slice(0,4):t;};
  const isS=s=>{ if(s==null||s==="") return false;
    if(String(s).indexOf("品质提升")>=0||String(s).indexOf("提升")>=0) return true;
    if(String(s).indexOf("\u2191")>=0) return true;
    const h=head(s); return h.indexOf("S")>=0||h.indexOf("s")>=0; };
  const isB=s=>{ if(s==null||s==="") return false; const h=head(s);
    return h.indexOf("B")>=0||h.indexOf("b")>=0||h.indexOf("币")>=0; };
  if(isS(after)) return "S";
  if(isB(after)) return "B";
  if(isS(before)) return "S";
  if(isB(before)) return "B";
  return "B";
}
// 单元格里找雕刻名 + 等级；找不到返回 null
function readCell(cell,names){
  const s=String(cell==null?"":cell).trim();
  if(!s) return null;
  for(const n of names){
    const i=s.indexOf(n);
    if(i>=0) return [n, gradeOf(s.slice(0,i), s.slice(i+n.length))];
  }
  const m=s.match(/^([\u4e00-\u9fa5]{2,6})\s*(S|s|B|b|\u2191|品质提升|提升)$/);
  if(m) return [m[1], gradeOf("",m[2])];
  return null;
}
// 从左到右、从上到下扫全部单元格，只认含雕刻信息的格子；
// 行号取该行最前面的数字（没有就按顺序 1、2、3）；颜色优先按表头，没表头就按雕刻出现的列顺序
function parseSeq(rows2d){
  if(!rows2d||!rows2d.length) return null;
  const names=effectNames();
  const rows=rows2d.map(r=>(r||[]).map(x=>String(x==null?"":x).trim()));
  let numCol=-1; const colOf={};
  for(let i=0;i<rows.length&&i<12;i++){
    const r=rows[i];
    for(let c=0;c<r.length;c++){
      const s=r[c]; if(!s) continue;
      if(numCol<0 && /次|轮|行|序|编号|回合|期/.test(s)) numCol=c;
      if(colOf["绿色"]===undefined && s.indexOf("绿")>=0) colOf["绿色"]=c;
      else if(colOf["蓝色"]===undefined && s.indexOf("蓝")>=0) colOf["蓝色"]=c;
      else if(colOf["红色"]===undefined && s.indexOf("红")>=0) colOf["红色"]=c;
      else if(colOf["紫色"]===undefined && s.indexOf("紫")>=0) colOf["紫色"]=c;
    }
    if(Object.keys(colOf).length>=4) break;
  }
  if(Object.keys(colOf).length<4){
    const cols=[];
    rows.forEach(r=>{ r.forEach((v,c)=>{ if(v && readCell(v,names) && cols.indexOf(c)<0) cols.push(c); }); });
    cols.sort((a,b)=>a-b);
    const used=Object.keys(colOf).map(k=>colOf[k]);
    COLORS.forEach(color=>{
      if(colOf[color]!==undefined) return;
      for(const c of cols){ if(used.indexOf(c)<0){ colOf[color]=c; used.push(c); break; } }
    });
  }
  const colorCols={};
  COLORS.forEach(c=>{ if(colOf[c]!==undefined) colorCols[c]=colOf[c]; });
  const nd={}; let cnt=0;
  rows.forEach(r=>{
    if(!r.length) return;
    const entry={}; const carvingCols=[];
    Object.keys(colorCols).forEach(color=>{
      const c=colorCols[color];
      if(c<0||c>=r.length) return;
      const got=readCell(r[c],names);
      if(!got) return;
      entry[color]=got; carvingCols.push(c);
    });
    if(!Object.keys(entry).length) return;
    let rno=0;
    if(numCol>=0&&numCol<r.length) rno=parseInt(r[numCol]);
    if(!(rno>0)){
      for(let c=0;c<r.length;c++){
        if(carvingCols.indexOf(c)>=0) break;
        const v=parseInt(r[c]);
        if(v>0){ rno=v; break; }
      }
    }
    if(!(rno>0)) rno=cnt+1;
    nd[String(rno)]=entry; cnt++;
  });
  return Object.keys(nd).length?nd:null;
}function applySeq(nd){
  if(!nd){toast(lang==="en"?"Header not found (need 次数/绿色/蓝色/红色/紫色 columns)":"未找到表头（需含 次数/绿/蓝/红/紫 列）");return;}
  const ks=Object.keys(nd);
  if(!ks.length){toast(lang==="en"?"No valid rows parsed":"未解析到有效数据行");return;}
  Object.keys(DATA).forEach(k=>delete DATA[k]);
  ks.forEach(k=>DATA[k]=nd[k]);
  renderSim();renderHome();renderRound();saveState();
  toast((lang==="en"?"Sequence imported: ":"序列已导入：")+ks.length+" "+(lang==="en"?"rows":"行"));
}

const TOP3=new Set(["坚固装甲","前仆后继","破坏阻滞"]);
function simulateApp(cv,tv,qv){
  CRYSTAL_SLIDER=cv;B=tv;C=qv;
  const keys=Object.keys(DATA).map(Number).sort((a,b)=>a-b);
  const miss0={"坚固装甲":0,"前仆后继":0,"破坏阻滞":0};
  if(!keys.length) return {dist:{1:0,2:0,3:0,4:0},used:{"绿色":0,"蓝色":0,"红色":0,"紫色":0},
    hours:0,topups:0,miss:miss0,avgN:1,samples:0};
  const rmin=keys[0],rmax=keys[keys.length-1];
  let stock={...DEFAULT_CRYSTALS};
  const used={"绿色":0,"蓝色":0,"红色":0,"紫色":0};
  const miss={"坚固装甲":0,"前仆后继":0,"破坏阻滞":0};
  let topups=0,hb=0; const counts=[];
  // 每一行都当作如果从这里开始选，而不是领完一次就跳到后面
  for(let start=rmin;start<=rmax;start++){
    const d=decideLines(DATA,start,stock);
    if(!d) continue;
    const set=[...new Set(d.picks.map(p=>p[1]))].sort((a,b)=>stock[a]-stock[b]);
    const co={}; set.forEach((c,i)=>co[c]=LINE_COST[i]);
    if(set.some(c=>stock[c]<co[c])){COLORS.forEach(c=>stock[c]+=TOPUP);topups++;}
    set.forEach(c=>{stock[c]-=co[c];used[c]+=co[c];});
    const pickedEff=new Set(d.picks.map(p=>p[2]));
    for(let rr=start;rr<start+d.n;rr++){
      if(!DATA[rr]) continue; let be=null,bq=-1;
      COLORS.forEach(c=>{ if(DATA[rr][c]&&DATA[rr][c].length>=2){
        const q=applyPreference(qualityNorm(DATA[rr][c][0],DATA[rr][c][1]),DATA[rr][c][0]);
        if(q>bq){bq=q;be=DATA[rr][c][0];}}});
      if(be&&TOP3.has(be)&&!pickedEff.has(be)) miss[be]++;
    }
    counts.push(d.n);
    hb+=HOURS_PER_RUN;
    while(hb>=24){hb-=24;COLORS.forEach(c=>stock[c]+=DAILY_GAIN);}
  }
  const dist={1:0,2:0,3:0,4:0}; counts.forEach(n=>dist[n]=dist[n]+1);
  const samples=counts.length;
  const total=counts.reduce((a,b)=>a+b,0);
  const avgN=samples?total/samples:1;
  const usedAvg={}; COLORS.forEach(c=>usedAvg[c]=used[c]/avgN);
  const missAvg={}; Object.keys(miss).forEach(k=>missAvg[k]=miss[k]/avgN);
  // 每行都算会把消耗/时间/兜底/遗漏放大到约平均行数倍，统一除回去
  return {dist:dist,used:usedAvg,hours:samples*HOURS_PER_RUN/avgN,
    topups:topups/avgN,miss:missAvg,avgN:avgN,samples:samples};
}const ws=document.querySelectorAll(".ws");

let selectedPlan=null;
function candidatePlans(start,stock){
  const plans=[];
  const keys=Object.keys(DATA).map(Number);
  const rmax=keys.length?Math.max(...keys):0;
  const maxN=Math.max(0,Math.min(4,rmax-start+1));
  const ns=(linesMode==="custom")?(customN<=maxN?[customN]:[]):(Array.from({length:maxN},(_,i)=>i+1));
  for(const n of ns){
    const rounds=[]; for(let r=start;r<start+n;r++) if(DATA[r]) rounds.push(r);
    if(rounds.length<n) continue;
    const Q2=q2of(DATA,rounds);
    for(const picked of perms(COLORS,n)){
      const picks=[]; let ok=true;
      rounds.forEach((rr,i)=>{const cell=DATA[rr][picked[i]];
        if(!cell||cell.length<2)ok=false; else picks.push([rr,picked[i],cell[0],cell[1]]);});
      if(!ok) continue;
      plans.push({n,picks,total:comboTotal(picks,n,Q2,stock,linesMode==="custom")});
    }
  }
  plans.sort((a,b)=>b.total-a.total);
  // 推荐规则：按显示分数（两位小数）从高到低分组，同分组整组一起给、不拆开，累计到 3 个就停
  const top=[];
  let i=0;
  // 同分组整组一起给，但一组最多 6 个（防止权重全 0 时 24 个同分全铺满屏幕）
  while(i<plans.length&&top.length<3){
    const key=Math.round(plans[i].total*100);
    while(i<plans.length&&Math.round(plans[i].total*100)===key){
      if(top.length>=6) break;
      top.push(plans[i]); i++;
    }
    if(top.length>=6) break;
  }
  return top;
}
