<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海岛奇兵雕刻选择</title>
<!-- 可选的 xlsx 解析库：defer 加载，绝不阻塞页面（离线时应用照常运行，只是暂不支持 .xlsx 导入） -->
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#121821; --card:#1b2430; --card2:#222d3c; --line:#2c3848;
  --tx:#e8edf3; --mut:#8b98a9; --mut2:#61707f;
  --gold:#e3a84b; --gold-d:#b9822f; --gold-tx:#e3a84b;
  --g:#43d17a; --b:#4cc3f5; --r:#ff7043; --p:#9e2f85;
  --page:#0b0f15; --bar:rgba(20,27,37,.98); --inp:#10161e; --panel:#0d1218;
  --selbg:linear-gradient(180deg,#26303f,#1d2735);
  --gs:#43D17A; --gb:#FFD54A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--page);color:var(--tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.5)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));flex:none;
  background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.topbar .sub{font-size:11px;color:var(--mut)}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}
.content{flex:1;overflow-y:auto;padding:14px 16px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:10px;letter-spacing:.3px}
.dots{display:flex;gap:6px;align-items:center}
.cdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.c-g{background:var(--g)}.c-b{background:var(--b)}.c-r{background:var(--r)}.c-p{background:var(--p)}
.duo{display:flex;gap:10px}
.duo .card{flex:1;margin-bottom:12px}
.seq{display:flex;gap:5px;margin-top:4px;min-height:30px;align-items:center;flex-wrap:nowrap}
.tile{width:calc((100% - 15px)/4);max-width:32px;aspect-ratio:1/1;height:auto;border-radius:22%;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0c1117}
.t-g{background:var(--g)}.t-b{background:var(--b)}.t-r{background:var(--r)}.t-p{background:var(--p)}
.efx{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.5}
.efx b{color:var(--tx);font-weight:600}
.gtime{font-size:10.5px;color:var(--mut2);margin-top:5px}
.gempty{color:var(--mut2);font-size:12px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
  border-radius:13px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.13s;width:100%;text-align:left;color:var(--tx)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--gold);background:var(--selbg)}
.opt.best{border-color:var(--b)}
.opt.best .radio{border-color:var(--b)}
.opt.best.sel .radio{border:5px solid var(--gold)}
.opt .best-tag{font-size:9.5px;color:var(--b);font-weight:700;margin-left:5px}
.opt .tiles{display:flex;gap:5px;flex-wrap:wrap}
.opt .mini{width:26px;height:26px;border-radius:7px;font-size:12px;color:#0c1117;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.opt .meta{flex:1;min-width:0}
.opt .meta .t{font-size:13px;font-weight:600}
.opt .cost{display:flex;gap:7px;margin-top:5px;flex-wrap:nowrap;overflow:hidden}
.opt .cost span{font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:3px;flex:none}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.sel .radio{border:5px solid var(--gold)}
.confirm{width:100%;border:none;padding:15px 16px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--gold);color:#1a1305;display:none;align-items:center;justify-content:center;gap:8px;
  flex:none;box-shadow:0 -8px 18px rgba(0,0,0,.55)}
.confirm.show{display:flex}
.opbar{flex:none;display:flex;background:var(--bar);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.opbtn{flex:1;border:none;background:none;color:var(--mut2);display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:4px 0;font-size:9.5px;cursor:pointer}
.opbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.opbtn.on{color:var(--gold-tx)}
.tabbar{flex:none;display:flex;background:var(--bar);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:none;background:none;color:var(--mut2);padding:7px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--gold-tx)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);padding:8px 4px;border-radius:8px;
  font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1305;font-weight:700}
.pane{display:none}.pane.on{display:block}
.choice{display:flex;align-items:center;gap:11px;width:100%;background:var(--card2);border:1.5px solid transparent;
  border-radius:11px;padding:11px 12px;margin-bottom:8px;color:var(--tx);cursor:pointer;text-align:left;font-size:13.5px}
.choice.on{border-color:var(--gold)}
.choice .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none}
.choice.on .rd{border:5px solid var(--gold)}
.choice small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.cinput{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.cinput label{font-size:13px;display:flex;align-items:center;gap:8px;flex:1}
.cinput input{width:90px;background:var(--inp);border:1px solid var(--line);border-radius:8px;color:var(--tx);
  font-size:16px;padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums}
.hday{font-size:11px;color:var(--mut2);margin:14px 2px 7px}
.hitem{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;margin-bottom:8px}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hrange{font-size:12.5px;font-weight:700;color:var(--gold-tx)}
.hpick{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx)}
.htime{font-size:10.5px;color:var(--mut);margin-top:6px}
.hitem .n{font-size:11px;color:var(--mut2);width:34px}
.hitem .nm{flex:1;font-size:13px}
.hitem .nm small{display:block;color:var(--mut);font-size:10.5px;margin-top:3px;font-weight:400}
.hitem .tm{font-size:11px;color:var(--mut)}
.about-hero{text-align:center;padding:18px 0 6px}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;
  background:linear-gradient(145deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center}
.logo svg{width:34px;height:34px;stroke:#1a1305;fill:none;stroke-width:1.8}
.ver{font-size:12px;color:var(--mut)}
.accrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.accrow.on{border-color:var(--gold);background:var(--card2)}
.accrow .av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;color:var(--gold-tx);flex:none}
.accrow.on .av{background:var(--gold);color:#1a1305}
.accrow .accinfo{flex:1;display:flex;flex-direction:column;min-width:0;text-align:left}
.accrow .accinfo b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .accinfo small{font-size:11px;color:var(--mut)}
.accrow .ren{flex:none;border:none;background:var(--card2);color:var(--mut2);border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.accrow .rd{width:16px;height:16px;border:2px solid var(--mut2);border-radius:50%;flex:none}
.accrow.on .rd{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--card2)}
.acc .av{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:var(--gold);flex:none}
.wl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:2px}
.wl b{color:var(--gold-tx)}
.wl .q{flex:none;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;background:var(--card2);
  color:var(--mut);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lnsel{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.infobody{padding:4px 2px;font-size:13px;line-height:1.75;color:var(--tx);white-space:pre-line}
.accrow .del{flex:none;border:none;background:var(--card2);color:#e0645c;border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wl .wv{width:76px;background:var(--inp);border:1px solid var(--line);border-radius:8px;color:var(--gold-tx);
  font-size:14px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
/* 雕刻权重双滑块 */
.efxw{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
.efxw:last-child{border-bottom:none}
.efxw-n{width:76px;font-size:12.5px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dual{position:relative;height:30px;flex:1;min-width:0}
.dual .track{position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line);border-radius:2px}
.dual input{position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;background:transparent;
  pointer-events:none;margin:0;height:30px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  cursor:pointer;pointer-events:auto;border:2px solid #0c1117}
.dual input.es::-webkit-slider-thumb{background:var(--gs)}
.dual input.eb::-webkit-slider-thumb{background:var(--gb)}
.dual input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;cursor:pointer;pointer-events:auto;border:2px solid #0c1117}
.dual input.es::-moz-range-thumb{background:var(--gs)}
.dual input.eb::-moz-range-thumb{background:var(--gb)}
.efxw-v{width:66px;font-size:10px;color:var(--mut);flex:none;text-align:right;font-variant-numeric:tabular-nums}
/* 自定义选项：起始行起 4 行 × 每行 4 色 = 16 个按钮 */
.opt.custcard{display:block;cursor:pointer}
.custgrid{display:flex;flex-direction:column;gap:5px;margin:8px 0 0}
.custrow{display:flex;gap:5px}
.cbtn{flex:1 1 0;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:8px;
  color:var(--tx);font-size:10.5px;padding:6px 3px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn.on{border-color:var(--gold);background:var(--selbg)}
.cbtn.dis,.cbtn:disabled{opacity:.32;cursor:not-allowed}
.cbtn.used{opacity:.4}
.cbtn .cn.b{color:#7fd4ff;font-weight:700}     /* 每行最优：浅蓝字 */
.cbtn.on .cn{color:var(--gold-tx);font-weight:700}  /* 已选：金色字 */
.custcost{margin-top:8px}
/* 序列菜单/查看 */
.seqlegend{display:flex;gap:14px;margin:2px 0 8px;font-size:10.5px;color:var(--mut)}
.seqlegend .lg{display:flex;align-items:center;gap:5px}
.seqlegend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line,rgba(255,255,255,.15))}
.seqlegend .sw.u{background:rgba(227,168,75,.55);background:color-mix(in srgb,var(--gold) 55%,transparent)}
.seqlegend .sw.q{background:rgba(76,195,245,.60)}
.seqt tr.hlu{background:rgba(227,168,75,.42);background:color-mix(in srgb,var(--gold) 42%,transparent)}
.seqt tr.hlq{background:rgba(76,195,245,.45)}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.74);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.mcard{width:86%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mcard h3{margin-bottom:12px;font-size:15px}
.mopt{display:block;width:100%;padding:12px;margin-bottom:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:14px;text-align:left}
.mopt:active{background:var(--line)}
.mopt.ghost{background:none;color:var(--mut)}
.mcard.wide{max-width:390px;height:76vh;display:flex;flex-direction:column}
.mtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mtitle h3{font-size:14px;margin:0}
.x{background:none;border:none;color:var(--mut);font-size:22px;padding:2px 8px}
.seqbody{flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.seqt{width:100%;border-collapse:collapse;font-size:12px}
.seqt th,.seqt td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.seqt th{position:sticky;top:0;background:var(--card2);color:var(--mut2)}
.seqt th.cg{color:var(--g)}.seqt th.cb{color:var(--b)}.seqt th.cr{color:var(--r)}.seqt th.cp{color:var(--p)}
input[type=range]{width:100%;height:30px;accent-color:var(--gold)}
.pchart{display:flex;align-items:flex-end;justify-content:space-around;height:150px;
  border-bottom:2px solid var(--line);padding:0 4px;margin-bottom:6px}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1}
.pbar{width:34px;background:linear-gradient(#7fb0e8,#5b93d6);border-radius:5px 5px 0 0;min-height:2px;transition:height .12s}
.pnum{font-size:12px;font-weight:700;margin-bottom:3px}
.plab{font-size:10.5px;color:var(--mut);margin-top:5px}
.pinfo{font-size:12px;line-height:1.7;color:var(--tx)}
.pinfo b{color:#e05a4f;font-weight:700}
.miss{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.miss span{font-size:11px;padding:4px 9px;border-radius:14px;background:var(--card2);color:var(--mut)}
.miss b{color:var(--gold-tx)}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
  background:#0d131b;border:1.2px solid var(--gold);color:#fff;font-weight:700;font-size:13.5px;
  padding:10px 16px;max-width:86%;text-align:center;white-space:normal;
  border-radius:24px;opacity:0;pointer-events:none;transition:.22s;z-index:20;
  box-shadow:0 3px 12px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ==== 与 App 1.1.0 对齐的补充样式 ==== */
.appl{margin-left:auto;background:var(--gold);color:#1a1305;border:none;border-radius:8px;
  padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.seqt{font-size:11px}
.seqt th,.seqt td{padding:5px 3px}
.cellw{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.cellw .enm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cellw .egr{font-weight:700;flex:none}
.logv{font-size:12.5px;font-weight:700;color:var(--gold-tx);flex:none}
.logd{font-size:11px;color:var(--mut2);margin-left:8px}
.logi{display:flex;gap:7px;font-size:12px;color:var(--mut);line-height:1.55;margin-top:4px}
.logi i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:6px}
/* 水晶图（内嵌 base64，与 App 同一批图） */
.cimg{display:inline-block;width:9px;height:14px;background-repeat:no-repeat;background-size:contain;background-position:center bottom;flex:none}

/* 权重预设按钮 */
.whead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.whead h3{margin-bottom:0;flex:1}
.chip{border:1px solid var(--gold);background:none;color:var(--gold-tx);border-radius:8px;padding:4px 8px;
  font-size:10.5px;cursor:pointer;flex:none;white-space:nowrap}
.chip.blue{border-color:var(--b);color:var(--b)}
/* ==== 1.5.3 新增：胶囊滑条 / 外观 / 获得顺序 / 序列底栏 / 日志折叠 ==== */
.eye{cursor:pointer;font-size:15px;user-select:none;line-height:1;flex:none;opacity:.9}
.eye.off{opacity:.35}
.pwrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.pwrow .lab{flex:none;min-width:44px;font-size:12.5px;display:flex;align-items:center;gap:4px}
.pwrow .val{width:54px;flex:none;text-align:right;font-size:12.5px;font-weight:700;
  color:var(--gold-tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.sl{position:relative;flex:1 1 auto;min-width:0;height:34px;touch-action:none;cursor:pointer}
.sl .trk{position:absolute;left:0;right:0;top:10px;height:14px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.sl .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;
  background:linear-gradient(180deg,var(--gold),var(--gold-d));
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 72%,#fff),var(--gold) 45%,var(--gold-d));overflow:hidden}
.sl .knob{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);width:26px;height:18px;border-radius:999px;
  background:rgba(255,255,255,.18);background:color-mix(in srgb,var(--gold) 52%,rgba(255,255,255,.10));
  border:1.5px solid rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(3px) saturate(1.6);backdrop-filter:blur(3px) saturate(1.6);
  box-shadow:0 1px 4px rgba(0,0,0,.4),inset 0 1px 2px rgba(255,255,255,.55)}
.sl.max .trk{box-shadow:0 0 14px var(--gold),0 0 4px var(--gold)}
.sl.max .knob{box-shadow:0 0 14px var(--gold),0 1px 4px rgba(0,0,0,.4)}
.sl .stars{position:absolute;inset:0;overflow:hidden}
.sl .stars i{position:absolute;background:#fff;border-radius:50%;animation:drift linear infinite,tw 2.2s ease-in-out infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-34px)}}
@keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
.sl:not(.max) .stars{display:none}
.phint{font-size:10.5px;color:var(--gold-tx);line-height:1.65;margin:2px 0 4px}
.pwrow .q,.whead .q{flex:none;width:17px;height:17px;border:1px solid var(--line);border-radius:50%;
  background:var(--card2);color:var(--mut);font-size:10.5px;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.lrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lrow .sp{margin-left:auto}
.lbtn{border:1.5px solid var(--line);background:none;color:var(--mut);border-radius:9px;
  padding:7px 16px;font-size:13px;cursor:pointer;flex:none}
.lbtn.on{background:var(--gold);color:#1a1305;border-color:var(--gold);font-weight:700}
.lrow .num{width:66px;flex:none;background:var(--inp);border:1px solid var(--line);border-radius:8px;
  color:var(--tx);font-size:15px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
/* 外观 */
.pal{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
.pal .nm{flex:1;min-width:0}
.pal input[type=color]{width:42px;height:30px;flex:none;border:1px solid var(--line);border-radius:8px;
  background:none;padding:0;cursor:pointer}
.pal .hex{width:82px;flex:none;background:var(--inp);border:1px solid var(--line);border-radius:8px;
  color:var(--tx);font-size:12px;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums;
  text-transform:uppercase}
.thbtns{display:flex;gap:8px;margin-top:2px}
.thbtns button{flex:1;border:1.5px solid var(--line);background:none;color:var(--tx);border-radius:9px;
  padding:8px 4px;font-size:12.5px;cursor:pointer}
.thbtns button.on{border-color:var(--gold);color:var(--gold-tx);font-weight:700}
/* 获得顺序：左色块 + 右文字框 等高 */
.gainer{display:flex;gap:8px;align-items:stretch}
/* 获得顺序：每项 = 左方块(一个字) + 右方框(全称 + S/B)，自动换行 */
.gwrap{display:flex;flex-wrap:wrap;gap:6px}
.gitem{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-width:100%}
.gsq{display:flex;align-items:center;justify-content:center;width:26px;min-height:26px;flex:none;
  font-weight:700;font-size:13px;color:#101010}
.gtx{display:flex;align-items:center;padding:0 7px;font-size:11.5px;font-weight:600;
  background:var(--card2);color:var(--tx);white-space:nowrap}
.gtime{font-size:11px;color:var(--mut);margin-top:6px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:74px;flex:none}
.tiles2 .mini{width:100%;height:100%;aspect-ratio:1/1;border-radius:8px;font-size:10.5px;font-weight:700;
  color:#0c1117;display:flex;align-items:center;justify-content:center}
.efxbox{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 9px;
  display:flex;align-items:center;background:var(--card2)}
.efxbox .efx{margin:0;font-size:11px;line-height:1.6;color:var(--tx)}
.gr-s,.efx b.gr-s,.efxbox b.gr-s,.hpick b.gr-s{color:var(--gs);font-weight:700}
.gr-b,.efx b.gr-b,.efxbox b.gr-b,.hpick b.gr-b{color:var(--gb);font-weight:700}
.cellw .gr-s,.cellw .gr-b{flex:none}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:3px}
.pcol .pnum{font-size:11px}
/* 序列底栏 / 所需水晶条 */
.costbar{display:none;flex:none;background:var(--bar);border-top:1px solid var(--line);
  padding:7px 14px;font-size:11px;color:var(--mut);align-items:center;gap:8px;flex-wrap:wrap}
.costbar.show{display:flex}
.costbar .cimg{margin-right:1px}
/* 日志折叠 */
.loghead{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0;user-select:none}
.logsum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;color:var(--mut)}
.logar{flex:none;color:var(--mut2);font-size:11px;transition:.15s}
.loghead.on .logar{transform:rotate(180deg)}
.logbody{display:none;margin:6px 0 12px;padding-left:2px}
.logbody.on{display:block}
.logitem{padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.logitem:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.mo-t{display:block;font-size:13.5px;font-weight:600}
.mo-s{display:block;color:var(--mut);font-size:11px;margin-top:3px}
/* 序列底栏：固定在最上层，面板永远遮不住它（App 1.4.3 要求"始终可见"） */
#seqbar{position:fixed;left:0;right:0;bottom:0;z-index:300;
  padding-bottom:calc(env(safe-area-inset-bottom) + 2px);
  box-shadow:0 -8px 20px rgba(0,0,0,.5)}
#seqView .mcard{max-height:calc(100vh - 150px)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ 主页 HOME ============ -->
  <section class="screen active" data-screen="home">
    <div class="topbar"><h1 id="appTitle">海岛奇兵雕刻选择</h1><span class="sub" id="roundSub"></span></div>
    <div class="content">
      <div class="duo">
        <div class="card">
          <h3 data-i18n="gain"></h3>
          <div id="gainContent"><span class="gempty" data-i18n="gainEmpty"></span></div>
        </div>
        <div class="card">
          <h3 data-i18n="lines"></h3>
          <input type="number" id="startLine" min="1" value="12"
            style="width:100%;background:var(--inp);border:1px solid var(--line);border-radius:9px;color:var(--tx);font-size:16px;padding:10px">
          <div class="efx" id="startHint"></div>
        </div>
      </div>

      <h3 style="font-size:12px;color:var(--mut);font-weight:600;margin:4px 2px 10px" data-i18n="options"></h3>
      <div id="optList"></div>
    </div>
    <div class="costbar" id="costBar"></div>
    <button class="confirm" id="confirmBtn">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      <span data-i18n="confirm"></span></button>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="screen" data-screen="history">
    <div class="topbar"><h1 data-i18n="history"></h1></div>
    <div class="content"><div id="histList"></div></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="screen" data-screen="settings">
    <div class="topbar"><h1 data-i18n="settings"></h1><button class="appl" id="efxApply" data-i18n="apply" style="display:none"></button></div>
    <div class="content">
      <div class="seg" id="setSeg">
        <button class="on" data-pane="preference" data-i18n="preference"></button>
        <button data-pane="language" data-i18n="language"></button>
        <button data-pane="about" data-i18n="about"></button>
        <button data-pane="account" data-i18n="account"></button>
      </div>

      <div class="pane on" data-pane="preference">
        <div class="card">
          <input type="range" class="ws" min="-1" max="1" step="0.01" value="0" style="display:none">
          <input type="range" class="ws" min="-1" max="1" step="0.01" value="0" style="display:none">
          <input type="range" class="ws" min="-1" max="1" step="0.01" value="0" style="display:none">
          <input id="wv0" data-i="0" type="hidden"><input id="wv1" data-i="1" type="hidden"><input id="wv2" data-i="2" type="hidden">
          <div class="whead"><h3 data-i18n="weights"></h3>
            <span class="eye" id="simEye" title="显示 / 隐藏模拟">👁</span>
            <button class="chip" id="wPreset"></button></div>
          <div class="lrow">
            <button class="lbtn on" data-grp="lines" data-lines="auto"><span data-i18n="lAuto"></span></button>
            <button class="lbtn" data-grp="lines" data-lines="custom"><span data-i18n="lFlex"></span></button>
            <span class="sp"></span>
            <span id="customNBox" style="display:none"><input type="number" id="customN" class="num" min="1" max="4" value="2"></span>
          </div>
          <div class="pwrow" style="display:none"><span class="lab"><span data-i18n="wCrystal"></span><button class="q" data-q="cry">?</button></span>
            <div class="sl" id="slC" data-mode="c"><div class="trk"><div class="fill"><div class="stars"></div></div></div><div class="knob"></div></div>
            <span class="val" id="valC">0.00</span></div>
          <div class="pwrow"><span class="lab"><span data-i18n="wTime"></span><button class="q" data-q="time">?</button></span>
            <div class="sl" id="slT" data-mode="t"><div class="trk"><div class="fill"><div class="stars"></div></div></div><div class="knob"></div></div>
            <span class="val" id="valT">0.00</span></div>
          <div class="pwrow"><span class="lab"><span data-i18n="wQuality"></span><button class="q" data-q="quality">?</button></span>
            <div class="sl" id="slQ" data-mode="q"><div class="trk"><div class="fill"><div class="stars"></div></div></div><div class="knob"></div></div>
            <span class="val" id="valQ">0.00</span></div>
          <div class="phint" id="qualHint"></div>
        </div>
        <div class="card" id="simCard">
          <div class="whead"><h3 data-i18n="simTitle"></h3>
            <span style="font-size:10.5px;color:var(--mut2);font-weight:400" data-i18n="probAxis"></span></div>
          <div class="pchart" id="pchart"></div>
          <div class="pinfo" id="pinfo"></div>
          <div class="miss" id="pmiss"></div>
        </div>
        <div class="card">
          <h3 data-i18n="strategy"></h3>
          <button class="choice on" data-grp="strat" data-pref="attack"><span data-i18n="sAttack"></span><span class="rd"></span></button>
          <button class="choice" data-grp="strat" data-pref="defence"><span data-i18n="sDefence"></span><span class="rd"></span></button>
          <button class="choice" data-grp="strat" data-pref="custom"><span data-i18n="sCustom"></span><span class="rd"></span></button>
        </div>
        <div class="card">
          <h3 data-i18n="efxWeight"></h3>
          <div class="seg" id="efxSeg">
            <button class="on" data-efxpane="atk" data-i18n="efxAtk"></button>
            <button data-efxpane="def" data-i18n="efxDef"></button>
          </div>
          <div id="efxList"></div>

        </div>
        <div class="card">
          <div class="whead"><h3 data-i18n="crystals"></h3>
            <button class="chip blue" id="algoBtn" data-i18n="algoDebug"></button></div>
          <div class="cinput"><label><i class="cimg cimg-lg cimg-g"></i><span data-i18n="cG"></span></label><input type="number" class="cryst" data-c="绿色" value="1000"></div>
          <div class="cinput"><label><i class="cimg cimg-lg cimg-b"></i><span data-i18n="cB"></span></label><input type="number" class="cryst" data-c="蓝色" value="1000"></div>
          <div class="cinput"><label><i class="cimg cimg-lg cimg-r"></i><span data-i18n="cR"></span></label><input type="number" class="cryst" data-c="红色" value="1000"></div>
          <div class="cinput"><label><i class="cimg cimg-lg cimg-p"></i><span data-i18n="cP"></span></label><input type="number" class="cryst" data-c="紫色" value="1000"></div>
        </div>
        <div class="card">
          <div class="whead"><h3 data-i18n="apprTitle"></h3><button class="chip" id="apprPreset" data-i18n="preset"></button></div>
          <div id="apprMenu" class="thbtns" style="display:none;margin-bottom:8px">
            <button data-usep="thDark" data-i18n="thDark"></button>
            <button data-usep="thLight" data-i18n="thLight"></button>
            <button data-usep="thReset" data-i18n="thReset"></button>
          </div>
          <div class="pal"><span class="nm" data-i18n="thTheme"></span>
            <input type="color" id="cTheme" value="#e3a84b"><input class="hex" id="hTheme" value="#E3A84B" spellcheck="false"></div>
          <div class="pal"><span class="nm" data-i18n="thBg"></span>
            <input type="color" id="cBg" value="#121821"><input class="hex" id="hBg" value="#121821" spellcheck="false"></div>
          <div class="pal"><span class="nm" data-i18n="thCard"></span>
            <input type="color" id="cCard" value="#1b2430"><input class="hex" id="hCard" value="#1B2430" spellcheck="false"></div>
          <div class="pal"><span class="nm" data-i18n="thLine"></span>
            <input type="color" id="cLine" value="#2c3848"><input class="hex" id="hLine" value="#2C3848" spellcheck="false"></div>
          <div class="thbtns">
            <button id="thDark" data-i18n="thDark"></button>
            <button id="thLight" data-i18n="thLight"></button>
            <button id="thReset" data-i18n="thReset"></button>
          </div>
        </div>
      </div>

      <div class="pane" data-pane="language">
        <div class="card">
          <h3 data-i18n="langTitle"></h3>
          <button class="choice" data-grp="lang" data-lang="en">English<span class="rd"></span></button>
          <button class="choice" data-grp="lang" data-lang="tc">繁體中文<span class="rd"></span></button>
          <button class="choice" data-grp="lang" data-lang="sc">简体中文<span class="rd"></span></button>
        </div>
      </div>

      <div class="pane" data-pane="about">
        <div class="card">
          <div class="about-hero">
            <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 9l-4.5 3.8L17 19l-5-3-5 3 1.5-6.2L4 9l5.8-.4z"/></svg></div>
            <div style="font-size:16px;font-weight:700;text-align:center">海岛奇兵雕刻选择</div>
            <div class="ver" style="text-align:center">Version 1.5.4</div>
          </div>
          <div style="font-size:12.5px;color:var(--mut);line-height:1.7;margin-top:10px" data-i18n="aboutText"></div>
        </div>
        <div class="card">
          <h3 data-i18n="changelog"></h3>
          <div id="logBox"></div>
        </div>
      </div>

      <div class="pane" data-pane="account">
        <div class="card">
          <h3 data-i18n="accTitle"></h3>
          <div id="accList"></div>
          <button class="btn btn-s" id="newAcc" data-i18n="newAcc"></button>

        </div>
      </div>
    </div>
  </section>

  <!-- 操作图标条（底部栏上方） -->
  <div class="opbar" id="opbar">
    <button class="opbtn" id="undoBtn">
      <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg><span data-i18n="undo"></span></button>
    <button class="opbtn" id="redoBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10h-9a5 5 0 0 0 0 10h3"/></svg><span data-i18n="redo"></span></button>
    <button class="opbtn" id="importBtn">
      <svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="import"></span></button>
    <button class="opbtn" id="exportBtn">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-3.5-3.5M12 15l3.5-3.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="export"></span></button>
    <button class="opbtn" id="orderBtn">
      <svg viewBox="0 0 24 24"><path d="M4 6h13M4 12h13M4 18h9"/><path d="M20 4l2 2-2 2M20 14l2 2-2 2"/></svg><span data-i18n="order"></span></button>
  </div>

  <!-- 序列打开时的底栏：导入 / 追加 / 删除 -->
  <div class="opbar" id="seqbar" style="display:none">
    <button class="opbtn on" id="sbImport">
      <svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="seqImport"></span></button>
    <button class="opbtn" id="sbAppend">
      <svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M17 14v7M13.5 17.5h7"/></svg><span data-i18n="seqAppend"></span></button>
    <button class="opbtn" id="sbDelete" style="color:#e0645c">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12M10 11v5M14 11v5"/></svg><span data-i18n="seqDelete"></span></button>
  </div>

  <!-- 预设菜单 -->
  <div class="modal" id="presetMenu">
    <div class="mcard">
      <h3 data-i18n="preset"></h3>
      <button class="mopt" data-preset="perfect"><span class="mo-t" data-i18n="pPerfect"></span><span class="mo-s" data-i18n="pPerfectSub"></span></button>
      <button class="mopt" data-preset="time"><span class="mo-t" data-i18n="pTime"></span><span class="mo-s" data-i18n="pTimeSub"></span></button>
      <button class="mopt" data-preset="value"><span class="mo-t" data-i18n="pValue"></span><span class="mo-s" data-i18n="pValueSub"></span></button>
      <button class="mopt" data-preset="orig"><span class="mo-t" data-i18n="pOrig"></span><span class="mo-s" data-i18n="pOrigSub"></span></button>
      <button class="mopt ghost" id="pmClose" data-i18n="close"></button>
    </div>
  </div>

  <!-- 算法调试：四色水晶每天增加（可为负） -->
  <div class="modal" id="algoModal">
    <div class="mcard">
      <div class="mtitle"><h3 data-i18n="algoDaily"></h3><button class="x" id="algoClose">×</button></div>
      <div class="cinput"><label><span class="dotc" style="background:var(--g)"></span><span data-i18n="cG"></span></label><input type="number" class="dailyg" data-c="绿色" value="2"></div>
      <div class="cinput"><label><span class="dotc" style="background:var(--b)"></span><span data-i18n="cB"></span></label><input type="number" class="dailyg" data-c="蓝色" value="2"></div>
      <div class="cinput"><label><span class="dotc" style="background:var(--r)"></span><span data-i18n="cR"></span></label><input type="number" class="dailyg" data-c="红色" value="2"></div>
      <div class="cinput"><label><span class="dotc" style="background:var(--p)"></span><span data-i18n="cP"></span></label><input type="number" class="dailyg" data-c="紫色" value="2"></div>
      <div class="pinfo" style="font-size:11px;color:var(--mut)" data-i18n="algoHint"></div>
    </div>
  </div>

  <!-- 导入预设菜单 -->
  <div class="modal" id="importMenu">
    <div class="mcard">
      <h3 data-i18n="importPreset"></h3>
      <button class="mopt" id="mImportBackup" data-i18n="importBackup"></button>
      <button class="mopt" id="mImportSeq" data-i18n="importSeq"></button>
      <button class="mopt ghost" id="mImportClose" data-i18n="close"></button>
    </div>
  </div>
  <!-- 滑块说明 -->
  <div class="modal" id="infoModal">
    <div class="mcard">
      <div class="mtitle"><h3 id="infoTitle"></h3><button class="x" id="infoClose">×</button></div>
      <div id="infoBody" class="infobody"></div>
    </div>
  </div>
  <!-- 序列菜单 -->
  <div class="modal" id="seqMenu">
    <div class="mcard">
      <h3 data-i18n="seqTitle"></h3>
      <button class="mopt" id="mViewSeq" data-i18n="viewSeq"></button>
      <button class="mopt" id="mChangeSeq" data-i18n="changeSeq"></button>
      <button class="mopt" id="mClearSeq" data-i18n="clearSeq" style="color:#e0645c"></button>
      <button class="mopt ghost" id="mClose" data-i18n="close"></button>
    </div>
  </div>
  <!-- 序列查看 -->
  <div class="modal" id="seqView">
    <div class="mcard wide">
      <div class="mtitle"><h3 id="seqViewTitle"></h3><button class="x" id="svClose">×</button></div>
      <div id="seqViewBody" class="seqbody"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab on" data-go="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span data-i18n="home"></span></button>
    <button class="tab" data-go="history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-i18n="history"></span></button>
    <button class="tab" data-go="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg><span data-i18n="settings"></span></button>
  </nav>

  <div class="toast" id="toast"></div>
</div>
<script>
// ==== 运行时错误收集（验收用：window.onerror 计数，正常应为 0） ====
window.__errs=[];
window.onerror=function(m,s,l,c,e){try{window.__errs.push(String(m)+" @"+(s||"")+":"+(l||0));}catch(_){}return false;};
window.addEventListener("unhandledrejection",function(ev){try{window.__errs.push("promise: "+ev.reason);}catch(_){}});
const SEQ_MAIN = {
"1": {"绿色": ["炼金技术", "S"], "蓝色": ["炼金技术", "S"], "红色": ["战地急救", "S"], "紫色": ["炼金技术", "S"]},
"2": {"绿色": ["炼金技术", "B"], "蓝色": ["情报压制", "S"], "红色": ["前仆后继", "S"], "紫色": ["活力汲取", "S"]},

function legacyEfxW(){
  const m={};
  [...ATTACK,...Object.keys(DEFENCE)].forEach(n=>{
    const s=SCORES[n+"|S"], b=SCORES[n+"|B"], ds=DEFENCE[n];

function migratePreset(d){
  const pv=(d&&d.presetVersion)?+d.presetVersion:1;
  if(pv>=PRESET_VERSION) return;
  const w=document.querySelectorAll(".ws");
  if(w.length>=3){
    if(Math.abs(+w[1].value+0.85)<1e-9) w[1].value=0;
    if(Math.abs(+w[2].value-1)<1e-9) w[2].value=0;
  }
  const legacy=legacyEfxW();
  Object.keys(EFX_W).forEach(n=>{
    const cur=EFX_W[n], old=legacy[n];
    if(!cur||!old) return;
    let s=+cur.S, b=+cur.B;
    if(s>1) s/=14;
    if(b>1) b/=14;
    if(Math.abs(s-old.S)<1e-6&&Math.abs(b-old.B)<1e-6){
      const v=EFX_TABLE[n]||EFX_OTHER; cur.S=v[0]; cur.B=v[1];
    }
  });
}
function qualityRaw(e,g){const w=EFX_W[e];return w&&w[g]!==undefined?w[g]:0.5;}

  if(PREFERENCE==="custom") return q;

  if(PREFERENCE==="attack"&&ia) return q*PREF_BOOST;
  if(PREFERENCE==="defence"&&id) return q*PREF_BOOST;
  if((PREFERENCE==="attack"||PREFERENCE==="defence")&&(ia||id)) return q*PREF_PENALTY;
  return q;
}

  const vs=COLORS.map(c=>st[c]); const m=vs.reduce((a,b)=>a+b,0)/vs.length;
  if(m<=0) return 1;
  const sd=Math.sqrt(vs.reduce((a,v)=>a+(v-m)**2,0)/vs.length);
  return Math.max(0,Math.min(1,1-sd/m));
}
function crystalDim(n,picks,cry,sl){
  if(sl===0||!cry) return 0;
  const uniq=[...new Set(picks.map(p=>p[1]))];
  const ranked=[...uniq].sort((a,b)=>cry[a]-cry[b]);
  const co={}; ranked.forEach((c,i)=>co[c]=LINE_COST[i]);
  const st={...cry}; picks.forEach(p=>{st[p[1]]-=co[p[1]];});
  const save=1-Object.values(co).reduce((a,b)=>a+b,0)/totalCost(4);
  const bal=-(1-balanceFactor(st));
  return sl>0? sl*save : (-sl)*bal;
}
function goodThreshold(Bv){
  if(Bv<=0.8) return GOOD_T;                 // 0.8及以下：门槛很严，基本最低2
  return GOOD_T*(1-(Bv-0.8)/0.2);           // 0.8 -> GOOD_T，1 -> 0（全放行）
}
function roundBest(data,r){
  const pr=COLORS.filter(c=>data[r][c]&&data[r][c].length>=2)
    .map(c=>applyPreference(qualityNorm(data[r][c][0],data[r][c][1]),data[r][c][0]));
  return pr.length?Math.max(...pr):0;
}
function nTarget(Bv){
  // 滑块决定的「目标条数」：-1 -> 4，0.8 -> 2，1 -> 1
  if(Bv<=0.8) return 4-(Bv+1)/1.8*2;  // -1:4，0.8:2
  return 2-(Bv-0.8)/0.2;              // 0.8:2，1:1
}
function timeScore(n,Bv){
  // 离目标条数越近分越高（峰=1，每差1条约 -0.67）
  return Math.max(-1, 1-Math.abs(n-nTarget(Bv))*0.67);
}
function comboTotal(picks,n,Q2,cry,ignoreTime){
  let Q1=0; picks.forEach(p=>Q1+=applyPreference(qualityNorm(p[2],p[3]),p[2]));
  const qs=Q2>0?2*(Q1/Q2)-1:-1;
  const ts=ignoreTime?0:timeScore(n,B);
  return crystalDim(n,picks,cry,CRYSTAL_SLIDER)+ts+qs*C;  // 时间分直接生效，B只定目标条数
}
function perms(arr,n){
  const r=[];
  (function rec(rem,cur){
    if(cur.length===n){r.push(cur);return;}
    for(let i=0;i<rem.length;i++)
      rec(rem.slice(0,i).concat(rem.slice(i+1)),cur.concat(rem[i]));
  })(arr,[]); return r;
}
function q2of(data,rounds){
  let Q2=0;
  rounds.forEach(rr=>{
    const pr=COLORS.filter(c=>data[rr][c]&&data[rr][c].length>=2)
      .map(c=>applyPreference(qualityNorm(data[rr][c][0],data[rr][c][1]),data[rr][c][0]));
    if(pr.length) Q2+=Math.max(...pr);
  }); return Q2;
}
function bestForN(data,start,n,cry){
  const rounds=[]; for(let r=start;r<start+n;r++) if(data[r]) rounds.push(r);
  if(rounds.length<n) return null;
  const Q2=q2of(data,rounds);
  // 质量 +∞ = 硬约束：每一行拾取的雕刻必须正好是该行权重最高者，否则这个方案不成立
  const hardInf = (typeof QUALITY_INF!=="undefined" && QUALITY_INF) || C>=998;
  const rowMax={};
  if(hardInf){
    rounds.forEach(rr=>{ let m=-1e9;
      COLORS.forEach(c=>{ const cell=data[rr][c];
        if(cell&&cell.length>=2){ const q=applyPreference(qualityNorm(cell[0],cell[1]),cell[0]); if(q>m) m=q; } });
      rowMax[rr]=m; });
  }
  let best=null;
  for(const picked of perms(COLORS,n)){
    const picks=[]; let ok=true;
    rounds.forEach((rr,i)=>{
      const cell=data[rr][picked[i]];
      if(!cell||cell.length<2){ ok=false; return; }
      if(hardInf){
        const q=applyPreference(qualityNorm(cell[0],cell[1]),cell[0]);
        if(q<rowMax[rr]-1e-9){ ok=false; return; }   // 这一行会漏掉最高权重 → 不接受
      }
      picks.push([rr,picked[i],cell[0],cell[1]]);
    });
    if(!ok) continue;
    const t=comboTotal(picks,n,Q2,cry);
    if(!best||t>best[0]) best=[t,picks];
  } return best;
}
function decideLines(data,start,cry){
  const keys=Object.keys(data).map(Number);
  const maxN=Math.min(4,Math.max(...keys)-start+1);
  let best=null;
  for(let n=1;n<=maxN;n++){
    const rounds=[]; for(let r=start;r<start+n;r++) if(data[r]) rounds.push(r);
    if(rounds.length<n) continue;
    if(n===1 && roundBest(data,start)<goodThreshold(B)) continue;  // 没好雕刻不选1
    const Q2=q2of(data,rounds);
    const res=bestForN(data,start,n,cry);
    if(!res) continue;
    const [total,picks]=res;
    let Q1=0; picks.forEach(p=>Q1+=applyPreference(qualityNorm(p[2],p[3]),p[2]));
    const cand={n,per:total/n,
      quality:Q2>0?2*(Q1/Q2)-1:-1,
      time:timeScore(n,B),
      crystal:crystalDim(n,picks,cry,CRYSTAL_SLIDER),picks};
    if(!best||cand.per>best.per) best=cand;
  } return best;
}

  // 拍平（新的在前）：某条的领取时间 = 比它新的那条的建造时间
  const flat=[];
  hist.forEach(g=>g.slice(1).forEach(it=>flat.push(it)));
  hist.forEach(group=>{
    const g0=group[0][0], g1=group[0][1];
    const dn=lang==="en"?(DAY_EN[g0]||g0):g0;
    const ds=lang==="en"?enDate(g1):g1;
    html+='<div class="hday">'+dn+"  "+ds+"</div>";
    group.slice(1).forEach(it=>{
      const idx=flat.indexOf(it);
      const claim=(idx>0)?flat[idx-1][1]:null;
      const picks=it[2]||[];
      const k=picks.length;
      const range=(k<=1)?("#"+(k===0?it[0]:(it[0]-1))):("#"+(it[0]-k)+" - "+(it[0]-1));
      const items=picks.map(c=>'<span class="hpick"><i class="cimg cimg-'+LETTERS[c[0]].toLowerCase()+'"></i>'+escapeHtml(efxName(c[1]))+" "+gradeTag(c[2])+'</span>').join("");
      const times=(claim==null)?("（"+L.buildTime+"："+it[1]+"　"+L.notClaimed+"）")
                              :("（"+L.buildTime+"："+it[1]+"　"+L.claimTime+"："+claim+"）");
      html+='<div class="hitem"><div class="hrow"><span class="hrange">'+range+'</span>'+items+'</div>'+
        '<div class="htime">'+times+'</div></div>';
    });
  });
  box.innerHTML=html;

function renderSeqView(){
  const a=ACCTS[curAcc];

    (lang==="en"?"Sequence":"雕刻序列")+" \u00B7 "+a.name+" ("+Object.keys(DATA).length+" "+(lang==="en"?"rows":"行")+")";
  const keys=Object.keys(DATA).map(Number).sort((x,y)=>x-y);
  // 高亮范围：未领取（金色）= 本次已建造未领取的行；本次查询（蓝色）= 起始行及其后 3 行，共 4 行
  const q0=parseInt(document.getElementById("startLine").value)||1, q1=q0+3;
  const un=(typeof GAIN_PICKS!=="undefined"&&GAIN_PICKS?GAIN_PICKS:[])
    .map(p=>+(p&&(p.row!==undefined?p.row:(p.start!==undefined?p.start:(p.n!==undefined?p.n:0))))).filter(v=>v>0);
  // 未领取 = 上一轮已建造、还没领取的那几行（= 起始行之前的 4 行）；有明确行号时优先用行号
  const uFrom=un.length?Math.min.apply(null,un):(q0-4>0?q0-4:null);
  const uTo=un.length?Math.max.apply(null,un):(q0-4>0?q0-1:null);
  let html='<div class="seqlegend"><span class="lg"><i class="sw u"></i>'+
    (lang==="en"?"built, not claimed":(lang==="tc"?"已建造未領取":"已建造未领取"))+
    '</span><span class="lg"><i class="sw q"></i>'+
    (lang==="en"?"current query":(lang==="tc"?"本次查詢":"本次查询"))+'</span></div>';
  html+='<table class="seqt"><thead><tr><th>'+(lang==="en"?"#":"行")+
    '</th><th class="cg">'+colorName("绿色")+'</th><th class="cb">'+colorName("蓝色")+
    '</th><th class="cr">'+colorName("红色")+'</th><th class="cp">'+colorName("紫色")+'</th></tr></thead><tbody>';
  keys.forEach(k=>{
    const d=DATA[k]||{};
    let cls="";
    if(uFrom!==null&&k>=uFrom&&k<=uTo) cls="hlu";
    if(k>=q0&&k<=q1) cls="hlq";
    html+='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+k+'</td>';
    COLORS.forEach(c=>{
      const v=d[c];
      if(v&&v[0]){
        html+='<td><div class="cellw"><span class="enm">'+escapeHtml(efx2(v[0]))+'</span>'+gradeTag(v[1])+'</div></td>';
      }else{
        html+='<td></td>';
      }
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById("seqViewBody").innerHTML=
    (keys.length?html:'<div class="gempty">'+(lang==="en"?"Empty sequence":"空序列，可用「更改雕刻序列」导入 CSV/XLSX")+'</div>');
}

function scrollSeqToUnclaimed(){
  const body=document.getElementById("seqViewBody");
  const trs=body.querySelectorAll("tbody tr");
  if(!trs.length) return;
  const keys=Object.keys(DATA).map(Number).sort((x,y)=>x-y);
  const un=(typeof GAIN_PICKS!=="undefined"&&GAIN_PICKS?GAIN_PICKS:[])
    .map(p=>+(p&&(p.row!==undefined?p.row:(p.start!==undefined?p.start:p.n)))).filter(n=>n>0);
  const anchor=un.length?Math.min.apply(null,un):(parseInt(document.getElementById("startLine").value)||1);
  let idx=keys.findIndex(k=>k>=anchor);
  if(idx<0) idx=keys.length-1;
  const h=trs[0].offsetHeight||26;
  body.scrollTop=Math.max(0,idx-1)*h;
}
function scrollSeqToCurrent(){

}

function importBackup(o){
  if(!o||o.app!=="carving_app"||o.kind!=="backup") return false;
  if(o.accounts){
    Object.keys(o.accounts).forEach(k=>{ACCTS[k]=o.accounts[k]; if(!ACCTS[k].seq) ACCTS[k].seq={};});
    if(o.curAcc&&ACCTS[o.curAcc]) curAcc=o.curAcc;
    else if(!ACCTS[curAcc]) curAcc=Object.keys(o.accounts)[0]||"main";
  }
  if(!ACCTS[curAcc].seq) ACCTS[curAcc].seq={};
  if(o.seq&&!Object.keys(ACCTS[curAcc].seq).length) ACCTS[curAcc].seq=o.seq;
  DATA=ACCTS[curAcc].seq;
  if(ACCTS[curAcc]&&!(ACCTS[curAcc].gain&&ACCTS[curAcc].gain.length)&&o.lastGain&&o.lastGain.length){
    ACCTS[curAcc].gain=o.lastGain;
    ACCTS[curAcc].gainTime=o.gainTime||null;
  }
  const s=o.settings||{};
  if(Array.isArray(s.ws)&&s.ws.length===3){const w=document.querySelectorAll(".ws");w[0].value=s.ws[0];w[1].value=s.ws[1];w[2].value=s.ws[2];}
  if(s.cry&&ACCTS[curAcc]) COLORS.forEach(c=>{if(s.cry[c]!==undefined)ACCTS[curAcc].crystals[c]=s.cry[c];});
  if(s.PREFERENCE) PREFERENCE=s.PREFERENCE;
  if(s.linesMode) linesMode=s.linesMode;
  if(s.customN) customN=Math.max(1,Math.min(4,s.customN));
  if(s.EFX_W) Object.keys(EFX_W).forEach(n=>{if(s.EFX_W[n]){
    EFX_W[n].S=s.EFX_W[n].S!==undefined?s.EFX_W[n].S:EFX_W[n].S;
    EFX_W[n].B=s.EFX_W[n].B!==undefined?s.EFX_W[n].B:EFX_W[n].B;}});

// ---- 序列导入（CSV / XLSX）：表头识别列，自动跳过空行/空列/空单元格，行数任意 ----
function csvRows(text){
  const t=String(text||"").replace(/^\uFEFF/,"");
  const delim=(t.includes("\t")&&!t.includes(","))?"\t":",";
  return t.split(/\r?\n/).map(l=>l.split(delim).map(x=>String(x==null?"":x).trim()));
}
// 全部雕刻名（长的先匹配，避免干扰抢走干扰信号）
function effectNames(){
  return [...ATTACK,...Object.keys(DEFENCE)].sort((a,b)=>b.length-a.length);
}
// 等级判定：S/s//品质提升/提升 -> S ； B/b/币/没写等级 -> B
function gradeOf(before,after){
  const head=s=>{const t=String(s==null?"":s).replace(/\s/g,"");return t.length>4?t.slice(0,4):t;};
  const isS=s=>{ if(s==null||s==="") return false;
    if(String(s).indexOf("品质提升")>=0||String(s).indexOf("提升")>=0) return true;
    if(String(s).indexOf("\u2191")>=0) return true;
    const h=head(s); return h.indexOf("S")>=0||h.indexOf("s")>=0; };
  const isB=s=>{ if(s==null||s==="") return false; const h=head(s);
    return h.indexOf("B")>=0||h.indexOf("b")>=0||h.indexOf("币")>=0; };
  if(isS(after)) return "S";
  if(isB(after)) return "B";
  if(isS(before)) return "S";
  if(isB(before)) return "B";
  return "B";
}
// 单元格里找雕刻名 + 等级；找不到返回 null
function readCell(cell,names){
  const s=String(cell==null?"":cell).trim();
  if(!s) return null;
  for(const n of names){
    const i=s.indexOf(n);
    if(i>=0) return [n, gradeOf(s.slice(0,i), s.slice(i+n.length))];
  }
  const m=s.match(/^([\u4e00-\u9fa5]{2,6})\s*(S|s|B|b|\u2191|品质提升|提升)$/);
  if(m) return [m[1], gradeOf("",m[2])];
  return null;
}
// 从左到右、从上到下扫全部单元格，只认含雕刻信息的格子；
// 行号取该行最前面的数字（没有就按顺序 1、2、3）；颜色优先按表头，没表头就按雕刻出现的列顺序
function parseSeq(rows2d){
  if(!rows2d||!rows2d.length) return null;
  const names=effectNames();
  const rows=rows2d.map(r=>(r||[]).map(x=>String(x==null?"":x).trim()));
  let numCol=-1; const colOf={};
  for(let i=0;i<rows.length&&i<12;i++){
    const r=rows[i];
    for(let c=0;c<r.length;c++){
      const s=r[c]; if(!s) continue;
      if(numCol<0 && /次|轮|行|序|编号|回合|期/.test(s)) numCol=c;
      if(colOf["绿色"]===undefined && s.indexOf("绿")>=0) colOf["绿色"]=c;
      else if(colOf["蓝色"]===undefined && s.indexOf("蓝")>=0) colOf["蓝色"]=c;
      else if(colOf["红色"]===undefined && s.indexOf("红")>=0) colOf["红色"]=c;
      else if(colOf["紫色"]===undefined && s.indexOf("紫")>=0) colOf["紫色"]=c;
    }
    if(Object.keys(colOf).length>=4) break;
  }
  if(Object.keys(colOf).length<4){
    const cols=[];
    rows.forEach(r=>{ r.forEach((v,c)=>{ if(v && readCell(v,names) && cols.indexOf(c)<0) cols.push(c); }); });
    cols.sort((a,b)=>a-b);
    const used=Object.keys(colOf).map(k=>colOf[k]);
    COLORS.forEach(color=>{
      if(colOf[color]!==undefined) return;
      for(const c of cols){ if(used.indexOf(c)<0){ colOf[color]=c; used.push(c); break; } }
    });
  }
  const colorCols={};
  COLORS.forEach(c=>{ if(colOf[c]!==undefined) colorCols[c]=colOf[c]; });
  const nd={}; let cnt=0;
  rows.forEach(r=>{
    if(!r.length) return;
    const entry={}; const carvingCols=[];
    Object.keys(colorCols).forEach(color=>{
      const c=colorCols[color];
      if(c<0||c>=r.length) return;
      const got=readCell(r[c],names);
      if(!got) return;
      entry[color]=got; carvingCols.push(c);
    });
    if(!Object.keys(entry).length) return;
    let rno=0;
    if(numCol>=0&&numCol<r.length) rno=parseInt(r[numCol]);
    if(!(rno>0)){
      for(let c=0;c<r.length;c++){
        if(carvingCols.indexOf(c)>=0) break;
        const v=parseInt(r[c]);
        if(v>0){ rno=v; break; }
      }
    }
    if(!(rno>0)) rno=cnt+1;
    nd[String(rno)]=entry; cnt++;
  });
  return Object.keys(nd).length?nd:null;
}function applySeq(nd){
  if(!nd){toast(lang==="en"?"Header not found (need 次数/绿色/蓝色/红色/紫色 columns)":"未找到表头（需含 次数/绿/蓝/红/紫 列）");return;}
  const ks=Object.keys(nd);
  if(!ks.length){toast(lang==="en"?"No valid rows parsed":"未解析到有效数据行");return;}
  if(importMode==="append"){                      // 追加：保留已有行，只补新行
    let added=0;
    ks.forEach(k=>{ if(!DATA[k]) added++; DATA[k]=nd[k]; });
    renderSim();renderHome();renderRound();renderSeqView();saveState();
    toast(added?(I18N[lang].seqAppendDone+added):I18N[lang].seqAppendNone);
    return;
  }
  Object.keys(DATA).forEach(k=>delete DATA[k]);
  ks.forEach(k=>DATA[k]=nd[k]);
  renderSim();renderHome();renderRound();renderSeqView();saveState();
  toast((lang==="en"?"Sequence imported: ":"序列已导入：")+ks.length+" "+(lang==="en"?"rows":"行"));
}

// 「算法调试」四色每天增加（可正可负），默认各 +2
const DAILY_GAIN_C={"绿色":DAILY_GAIN,"蓝色":DAILY_GAIN,"红色":DAILY_GAIN,"紫色":DAILY_GAIN};
// 可能遗漏：按用户当前「雕刻权重」取前三名
function missTop3(){
  return [...ATTACK,...Object.keys(DEFENCE)]
    .sort((a,b)=>(EFX_W[b].S-EFX_W[a].S)||(EFX_W[b].B-EFX_W[a].B)).slice(0,3);
}
function missZero(){ const m={}; missTop3().forEach(n=>m[n]=0); return m; }
function simulateApp(cv,tv,qv){
  CRYSTAL_SLIDER=cv;B=tv;C=qv;
  const keys=Object.keys(DATA).map(Number).sort((a,b)=>a-b);
  const M3=missTop3(), miss0=missZero();
  if(!keys.length) return {dist:{1:0,2:0,3:0,4:0},used:{"绿色":0,"蓝色":0,"红色":0,"紫色":0},
    hours:0,topups:0,miss:miss0,avgN:1,samples:0,m3:M3};
  const rmin=keys[0],rmax=keys[keys.length-1];
  let stock={...DEFAULT_CRYSTALS};
  const used={"绿色":0,"蓝色":0,"红色":0,"紫色":0};
  const miss=missZero();
  let topups=0,hb=0; const counts=[];
  // 每一行都当作如果从这里开始选，而不是领完一次就跳到后面
  for(let start=rmin;start<=rmax;start++){
    const d=decideLines(DATA,start,stock);
    if(!d) continue;
    const set=[...new Set(d.picks.map(p=>p[1]))].sort((a,b)=>stock[a]-stock[b]);
    const co={}; set.forEach((c,i)=>co[c]=LINE_COST[i]);
    if(set.some(c=>stock[c]<co[c])){COLORS.forEach(c=>stock[c]+=TOPUP);topups++;}
    set.forEach(c=>{stock[c]-=co[c];used[c]+=co[c];});
    const pickedEff=new Set(d.picks.map(p=>p[2]));
    for(let rr=start;rr<start+d.n;rr++){
      if(!DATA[rr]) continue; let be=null,bq=-1;
      COLORS.forEach(c=>{ if(DATA[rr][c]&&DATA[rr][c].length>=2){
        const q=applyPreference(qualityNorm(DATA[rr][c][0],DATA[rr][c][1]),DATA[rr][c][0]);
        if(q>bq){bq=q;be=DATA[rr][c][0];}}});
      if(be&&M3.indexOf(be)>=0&&!pickedEff.has(be)) miss[be]++;
    }
    counts.push(d.n);
    hb+=HOURS_PER_RUN;
    while(hb>=24){hb-=24;COLORS.forEach(c=>stock[c]+=(+DAILY_GAIN_C[c]||0));}
  }
  const dist={1:0,2:0,3:0,4:0}; counts.forEach(n=>dist[n]=dist[n]+1);
  const samples=counts.length;
  const total=counts.reduce((a,b)=>a+b,0);
  const avgN=samples?total/samples:1;
  const usedAvg={}; COLORS.forEach(c=>usedAvg[c]=used[c]/avgN);
  const missAvg={}; Object.keys(miss).forEach(k=>missAvg[k]=miss[k]/avgN);
  // 每行都算会把消耗/时间/兜底/遗漏放大到约平均行数倍，统一除回去
  return {dist:dist,used:usedAvg,hours:samples*HOURS_PER_RUN/avgN,
    topups:topups/avgN,miss:missAvg,avgN:avgN,samples:samples,m3:M3};
}

const DEFAULT_THEME={gold:"#e3a84b",bg:"#121821",card:"#1b2430",line:"#2c3848"};
let THEME={...DEFAULT_THEME}, themePreset="dark";
const PRESET_THEMES={
  dark:{gold:"#e3a84b",bg:"#121821",card:"#1b2430",line:"#2c3848"},
  light:{gold:"#c08a2e",bg:"#f2f4f7",card:"#ffffff",line:"#dde3eb"}
};
function hex2rgb(h){ const m=String(h||"").replace("#","").trim();
  if(m.length===3) return {r:parseInt(m[0]+m[0],16)||0,g:parseInt(m[1]+m[1],16)||0,b:parseInt(m[2]+m[2],16)||0};
  return {r:parseInt(m.slice(0,2),16)||0,g:parseInt(m.slice(2,4),16)||0,b:parseInt(m.slice(4,6),16)||0}; }
function rgb2hex(r,g,b){ const f=v=>("0"+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);
  return "#"+f(r)+f(g)+f(b); }
function mixHex(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b);
  return rgb2hex(A.r+(B.r-A.r)*t,A.g+(B.g-A.g)*t,A.b+(B.b-A.b)*t); }
function hexA(h,a){ const c=hex2rgb(h); return "rgba("+c.r+","+c.g+","+c.b+","+a+")"; }
function lumOf(h){ const c=hex2rgb(h);
  const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(c.r)+0.7152*f(c.g)+0.0722*f(c.b); }
// 主题色文字「亮度下限保护」：背景偏暗就保证足够亮，背景偏亮就保证足够暗
function themeText(gold,bg){
  const dark=lumOf(bg)<0.4, target=dark?"#ffffff":"#000000";
  let c=String(gold).toLowerCase();
  for(let i=0;i<30;i++){
    const L=lumOf(c);
    if(dark? L>=0.22 : L<=0.18) break;
    c=mixHex(c,target,0.07);
  }
  return c;
}
function isHex(s){ return /^#?[0-9a-fA-F]{6}$/.test(String(s||"").trim())||/^#?[0-9a-fA-F]{3}$/.test(String(s||"").trim()); }
function normHex(s){ s=String(s||"").trim(); if(s.charAt(0)!=="#") s="#"+s;
  if(s.length===4) s="#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
  return s.toLowerCase(); }
function applyTheme(){
  const r=document.documentElement.style, light=lumOf(THEME.bg)>=0.6;
  r.setProperty("--gold",THEME.gold);
  r.setProperty("--gold-d",mixHex(THEME.gold,"#000000",0.22));
  r.setProperty("--gold-tx",themeText(THEME.gold,THEME.bg));
  r.setProperty("--bg",THEME.bg);
  r.setProperty("--card",THEME.card);
  r.setProperty("--card2",light?mixHex(THEME.card,"#000000",0.05):mixHex(THEME.card,"#ffffff",0.07));
  r.setProperty("--line",THEME.line);
  r.setProperty("--page",light?mixHex(THEME.bg,"#000000",0.06):mixHex(THEME.bg,"#000000",0.35));
  r.setProperty("--bar",hexA(THEME.bg,0.94));
  r.setProperty("--inp",light?mixHex(THEME.card,"#000000",0.05):mixHex(THEME.card,"#000000",0.4));
  r.setProperty("--panel",light?mixHex(THEME.card,"#000000",0.03):mixHex(THEME.card,"#000000",0.45));
  r.setProperty("--selbg","linear-gradient(180deg,"+mixHex(THEME.card,light?"#000000":"#ffffff",0.12)+
    ","+mixHex(THEME.card,light?"#000000":"#ffffff",0.04)+")");
  r.setProperty("--tx",light?"#1a2430":"#e8edf3");
  r.setProperty("--mut",light?"#5d6b7c":"#8b98a9");
  r.setProperty("--mut2",light?"#8794a5":"#61707f");
}

// ================= 主页动态推荐 =================
let selectedPlan=null;
function candidatePlans(start,stock){
  const plans=[];
  const keys=Object.keys(DATA).map(Number);
  const rmax=keys.length?Math.max(...keys):0;
  const maxN=Math.max(0,Math.min(4,rmax-start+1));
  const ns=(linesMode==="custom")?(customN<=maxN?[customN]:[]):(Array.from({length:maxN},(_,i)=>i+1));
  for(const n of ns){
    const rounds=[]; for(let r=start;r<start+n;r++) if(DATA[r]) rounds.push(r);
    if(rounds.length<n) continue;
    const Q2=q2of(DATA,rounds);
    for(const picked of perms(COLORS,n)){
      const picks=[]; let ok=true;
      rounds.forEach((rr,i)=>{const cell=DATA[rr][picked[i]];
        if(!cell||cell.length<2)ok=false; else picks.push([rr,picked[i],cell[0],cell[1]]);});
      if(!ok) continue;
      plans.push({n,picks,total:comboTotal(picks,n,Q2,stock,linesMode==="custom")});
    }
  }
  plans.sort((a,b)=>b.total-a.total);
  // 推荐规则：按显示分数（两位小数）从高到低分组，同分组整组一起给、不拆开，累计到 3 个就停
  const top=[];
  let i=0;
  // 同分组整组一起给，但一组最多 6 个（防止权重全 0 时 24 个同分全铺满屏幕）
  while(i<plans.length&&top.length<3){
    const key=Math.round(plans[i].total*100);
    while(i<plans.length&&Math.round(plans[i].total*100)===key){
      if(top.length>=6) break;
      top.push(plans[i]); i++;
    }
    if(top.length>=6) break;
  }
  return top;
}
let GAIN_PICKS=null, GAIN_TIME=null;
// 与 App 一致的获得顺序卡片：lastGain=[[色,雕刻,等级]...] + 时间
function gainHtml(picks,time){
  if(!picks||!picks.length) return "";
  const tiles=picks.map(x=>`<div class="mini t-${LETTERS[x[0]].toLowerCase()}">${escapeHtml(colorName(x[0]))}</div>`).join("");
  const efx=picks.map(x=>escapeHtml(colorFull(x[0]))+" "+escapeHtml(efxName(x[1]))+" "+gradeTag(x[2])).join(" \u00B7 ");
  return '<div class="gwrap">'+picks.map(function(x){
      var cls="t-"+LETTERS[x[0]].toLowerCase();
      return '<span class="gitem"><span class="gsq '+cls+'">'+escapeHtml(colorName(x[0]))+'</span>'+
             '<span class="gtx">'+escapeHtml(efxName(x[1]))+' '+gradeTag(x[2])+'</span></span>';
    }).join("")+'</div>'+
    '<div class="gtime">'+I18N[lang].buildTime+(time?" \u00B7 "+time:"")+'</div>';
}

function colorTile(c){return `<div class="mini t-${LETTERS[c].toLowerCase()}">${colorName(c)}</div>`;}
function planKey(p){ return p.n+"|"+p.picks.map(x=>x[0]+x[1]).join(","); }
// 所需水晶（与推荐方案里的消耗标记完全同格式）
function planCost(p,stock){
  const ranked=[...new Set(p.picks.map(x=>x[1]))].sort((a,b)=>stock[a]-stock[b]);
  const co={}; ranked.forEach((c,i)=>co[c]=LINE_COST[i]);
  return {ranked,co,html:ranked.map(c=>`<span><i class="cimg cimg-${LETTERS[c].toLowerCase()}"></i>${co[c]}</span>`).join("")};
}
function setSelectedPlan(p){
  selectedPlan=p||null;
  const bar=document.getElementById("costBar"), btn=document.getElementById("confirmBtn");
  if(!bar||!btn) return;
  if(!selectedPlan){ bar.classList.remove("show"); bar.innerHTML=""; btn.classList.remove("show"); return; }
  const stk=curStock(), c=planCost(selectedPlan,stk);
  bar.innerHTML='<b style="color:var(--gold-tx)">'+I18N[lang].costNeed+'</b>'+
    '<span style="color:var(--tx)">'+selectedPlan.n+I18N[lang].line+'</span>'+c.html;
  bar.classList.add("show"); btn.classList.add("show");
}
function renderHome(){
  const L=I18N[lang];
  const start=parseInt(document.getElementById("startLine").value)||1;
  const stock=curStock();
  renderRound();
  const plans=candidatePlans(start,stock);
  const keys=plans.map(p=>Math.round(p.total*100));
  const bestVal=keys.length?Math.max(...keys):0;
  const bestCount=keys.filter(k=>k===bestVal).length;
  const keep=selectedPlan?planKey(selectedPlan):null;
  let sel=-1, html="";
  plans.forEach((p,idx)=>{
    const c=planCost(p,stock);
    const tiles=p.picks.map(x=>colorTile(x[1])).join("");
    const efx=p.picks.map(x=>colorName(x[1])+" "+efxName(x[2])+" "+x[3]).join(" · ");
    const isBest=Math.round(p.total*100)===bestVal;   // 并列最佳都标蓝
    if(keep&&planKey(p)===keep) sel=idx;
    html+=`<button class="opt${isBest?" best":""}" data-plan="${idx}">
      <div class="tiles">${tiles}</div>
      <div class="meta"><div class="t">${p.n}${L.line} · ${L.score} ${p.total.toFixed(2)}${isBest?'<span class="best-tag">'+(bestCount>1?L.tieBest:L.best)+'</span>':''}</div>
        <div class="cost">${c.html}</div>
        <div class="efx"><b>${efx}</b></div></div>
      <div class="radio"></div></button>`;
  });
  // ===== 第 4 个选项：自定义（起始行起 4 行 × 每行 4 色 = 16 个按钮）=====
  const cRows=[start,start+1,start+2,start+3];
  const tidyCustom=()=>{ const k=[]; for(const rr of cRows){ const F=customPicks.find(p=>p[0]===rr); if(!F) break; k.push(F); } customPicks=k; };
  customPicks=(customPicks||[]).filter(p=>p&&p[0]>=start&&p[0]<=start+3); tidyCustom();
  const rowBest=(r)=>{ let best=-1e9,out=[];
    COLORS.forEach(c=>{ const cell=(DATA[r]||{})[c]; if(!cell||!cell[0]) return;
      const w=((EFX_W[cell[0]]||{})[cell[1]])||0;
      if(w>best+1e-9){best=w;out=[c];} else if(Math.abs(w-best)<=1e-9){out.push(c);} });
    return out; };
  const customPlanObj=()=>({n:customPicks.length,picks:customPicks.slice(),total:0});
  const cCost=customPicks.length?planCost({picks:customPicks},stock):null;
  let cust='<div class="opt custcard'+(selCustom?" sel":"")+'" id="customCard">'+
    '<div class="t"><b>'+(L.customOpt||L.sCustom||((CUSTOM_TXT.title||{})[lang])||"自定义")+'</b></div><div class="custgrid">';
  cRows.forEach((r,ri)=>{
    const ok=(ri===0)||customPicks.some(p=>p[0]===cRows[ri-1]);
    const best=rowBest(r);
    cust+='<div class="custrow">';
    COLORS.forEach(c=>{
      const cell=(DATA[r]||{})[c], has=!!(cell&&cell[0]);
      const picked=customPicks.some(p=>p[0]===r&&p[1]===c);
      const used=customPicks.some(p=>p[0]!==r&&p[1]===c);
      const can=ok&&has&&!used;
      const label=has?(colorName(c)+" "+efx2(cell[0])+" "+cell[1]):(colorName(c)+" —");
      cust+='<button class="cbtn'+(picked?" on":"")+(used?" used":"")+(can?"":" dis")+'"'+(can?"":" disabled")+
            ' data-crow="'+r+'" data-ccolor="'+c+'"><span class="cn'+(picked?" g":(best.indexOf(c)>=0?" b":""))+'">'+
            label+'</span></button>';
    });
    cust+='</div>';
  });
  cust+='</div><div class="cost custcost">'+(cCost?cCost.html:'<span style="color:var(--mut2)">'+(L.customHint||((CUSTOM_TXT.hint||{})[lang])||"")+'</span>')+'</div></div>';
  html+=cust;
  const list=document.getElementById("optList");
  list.innerHTML=html||`<div class="gempty">${L.noPlan}</div>`;
  list.querySelectorAll(".opt[data-plan]").forEach(o=>o.addEventListener("click",()=>{
    list.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    selCustom=false;
    o.classList.add("sel");
    setSelectedPlan(plans[+o.dataset.plan]);
  }));
  const cc=list.querySelector("#customCard");
  if(cc){
    cc.addEventListener("click",e=>{
      const b=e.target.closest(".cbtn");
      if(!b||b.disabled){                       // 点大框=选中自定义，第一行默认取最优
        if(!customPicks.length){ const best=rowBest(start);
          if(best.length){ const cell=DATA[start][best[0]]; customPicks=[[start,best[0],cell[0],cell[1]]]; } }
        selCustom=true; setSelectedPlan(customPicks.length?customPlanObj():null); renderHome(); return;
      }
      e.stopPropagation();
      const r=+b.dataset.crow, c=b.dataset.ccolor;
      if(customPicks.some(p=>p[0]===r&&p[1]===c)) customPicks=customPicks.filter(p=>!(p[0]===r&&p[1]===c));
      else{
        customPicks=customPicks.filter(p=>p[0]!==r&&p[1]!==c);   // 同色不能重复用
        const cell=DATA[r][c]; customPicks.push([r,c,cell[0],cell[1]]);
        customPicks.sort((a,b2)=>a[0]-b2[0]);
      }
      tidyCustom();
      selCustom=customPicks.length>0;
      setSelectedPlan(selCustom?customPlanObj():null);
      renderHome();
    });
  }
  if(!selCustom){
    if(sel<0&&plans.length) sel=0;                     // 默认第一行（最优）即选中
    if(sel>=0&&plans[sel]){
      setSelectedPlan(plans[sel]);
      const el=list.querySelector('.opt[data-plan="'+sel+'"]'); if(el) el.classList.add("sel");
    }else setSelectedPlan(null);
  }
  saveState();
}

  if(ACCTS[curAcc]){ ACCTS[curAcc].gain=GAIN_PICKS; ACCTS[curAcc].gainTime=t; }
  const start=parseInt(document.getElementById("startLine").value)||1;
  const newStart=start+p.n;
  document.getElementById("startLine").value=newStart;
  const a=ACCTS[curAcc];
  const entry=[newStart,t,p.picks.map(x=>[x[1],x[2],x[3]])];
  if(a.hist[0]&&a.hist[0][0][1]===todayPart()) a.hist[0].splice(1,0,entry);
  else a.hist.unshift([[todayWord(),todayPart()],entry]);
  undoStack.push({from:start,to:newStart,entry,gainBefore,gainAfter}); redoStack=[]; setUru();
  renderHistory(); renderRound();
  setTimeout(()=>renderHome(),1000);
  saveState();
  toast((lang==="en"?"Gained ":"已获得 ")+p.n+" "+I18N[lang].line);
});
